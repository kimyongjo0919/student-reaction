<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>META FLOW+ · 실험 선택</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08090f;--bg2:#111520;--bg3:#1a1f2e;--bg4:#222840;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.14);
  --text:#eef0f8;--muted:#6b7494;
  --accent:#f97316;--green:#10b981;--yellow:#fbbf24;--purple:#a855f7;--cyan:#06b6d4;
  --radius:16px;--rsm:10px;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* 헤더 */
header{background:linear-gradient(135deg,#0d1117 0%,#1a1f2e 100%);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
.logo-wrap{display:flex;flex-direction:column}
.logo{font-size:20px;font-weight:800;letter-spacing:-.02em}
.logo span{color:var(--accent)}
.logo-sub{font-size:11px;color:var(--muted);margin-top:2px}
.stu-badge{background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:600;display:none}
.stu-badge.show{display:block}

/* 학생 입력 */
.login-wrap{max-width:400px;margin:60px auto;padding:0 20px}
.login-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:28px}
.login-title{font-size:18px;font-weight:700;margin-bottom:4px}
.login-sub{font-size:12px;color:var(--muted);margin-bottom:20px}
.field{margin-bottom:12px}
.field label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px;font-weight:600}
.field input{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:var(--rsm);color:var(--text);padding:10px 13px;font-size:14px;outline:none;transition:.2s;font-family:inherit}
.field input:focus{border-color:var(--accent)}
.btn-login{width:100%;background:var(--accent);border:none;color:#fff;padding:12px;border-radius:var(--rsm);font-size:14px;font-weight:700;cursor:pointer;transition:.2s;margin-top:4px}
.btn-login:hover{filter:brightness(1.1)}

/* 메인 콘텐츠 */
.main{max-width:720px;margin:0 auto;padding:24px 20px;display:none}
.main.show{display:block}
.section-title{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}

/* 오늘 수업 배너 */
.today-banner{background:linear-gradient(135deg,rgba(249,115,22,.15),rgba(168,85,247,.1));border:1px solid rgba(249,115,22,.3);border-radius:var(--radius);padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;gap:14px}
.today-icon{font-size:28px}
.today-text h3{font-size:14px;font-weight:700;margin-bottom:2px}
.today-text p{font-size:12px;color:var(--muted)}
.today-count{margin-left:auto;background:var(--accent);color:#fff;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;white-space:nowrap}

/* 실험 카드 그리드 */
.exp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:24px}
.exp-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;cursor:pointer;transition:.25s;position:relative;overflow:hidden;text-decoration:none;color:var(--text);display:block}
.exp-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--card-color,var(--accent))}
.exp-card:hover{border-color:var(--border2);transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.exp-card.inactive{opacity:.45;cursor:not-allowed;pointer-events:none}
.exp-card.inactive::before{background:var(--muted)}
.exp-card.done{border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.05)}
.exp-card.done::before{background:var(--green)}
.exp-card-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.exp-icon{font-size:28px}
.exp-status{font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px}
.status-active{background:rgba(249,115,22,.2);color:var(--accent)}
.status-done{background:rgba(16,185,129,.2);color:var(--green)}
.status-inactive{background:rgba(107,116,148,.2);color:var(--muted)}
.exp-title{font-size:15px;font-weight:700;margin-bottom:4px}
.exp-sub{font-size:11px;color:var(--muted);margin-bottom:12px;line-height:1.5}
.exp-tags{display:flex;gap:5px;flex-wrap:wrap}
.exp-tag{font-size:10px;padding:2px 7px;border-radius:5px;background:var(--bg3);color:var(--muted);border:1px solid var(--border)}
.exp-card.done .exp-tag{background:rgba(16,185,129,.1);color:var(--green);border-color:rgba(16,185,129,.2)}
.exp-done-badge{position:absolute;bottom:14px;right:14px;font-size:20px}
.inactive-msg{position:absolute;bottom:14px;right:14px;font-size:10px;color:var(--muted)}

/* 내 기록 섹션 */
.record-list{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.record-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rsm);padding:12px 14px;display:flex;align-items:center;gap:12px}
.record-icon{font-size:18px;width:36px;text-align:center}
.record-info{flex:1}
.record-title{font-size:12px;font-weight:600}
.record-date{font-size:10px;color:var(--muted);margin-top:2px}
.record-score{font-size:13px;font-weight:700;color:var(--accent)}
.empty-record{text-align:center;padding:32px;color:var(--muted);font-size:13px}

/* 로딩 */
.loading{text-align:center;padding:48px;color:var(--muted)}
.loading-spinner{width:32px;height:32px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* 토스트 */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--border2);border-radius:20px;padding:8px 18px;font-size:12px;z-index:500;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

/* 진행도 바 */
.progress-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rsm);padding:14px 16px;margin-bottom:20px}
.progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.progress-label{font-size:12px;font-weight:600}
.progress-pct{font-size:13px;font-weight:700;color:var(--accent)}
.progress-bar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--purple));transition:width .6s ease}
.progress-subs{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap}
.progress-sub-item{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:4px}
.ps-dot{width:6px;height:6px;border-radius:50%}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<header>
  <div class="logo-wrap">
    <div class="logo">META <span>FLOW+</span></div>
    <div class="logo-sub">과학 탐구 문해력 플랫폼</div>
  </div>
  <div class="stu-badge" id="stu-badge">👤 <span id="stu-name-hdr">-</span></div>
</header>

<!-- 학생 로그인 -->
<div class="login-wrap" id="login-wrap">
  <div class="login-card">
    <div class="login-title">🔬 META FLOW+ 시작</div>
    <div class="login-sub">학번과 이름을 입력하고 오늘의 실험을 선택하세요</div>
    <div class="field"><label>학번</label><input id="s-id" placeholder="예: 20301" maxlength="10"></div>
    <div class="field"><label>이름</label><input id="s-name" placeholder="홍길동" maxlength="10"></div>
    <div class="field"><label>학년/반</label><input id="s-cls" placeholder="예: 2-3" maxlength="6"></div>
    <button class="btn-login" onclick="loginStudent()">시작하기 →</button>
  </div>
</div>

<!-- 메인 -->
<div class="main" id="main">

  <!-- 오늘 수업 배너 -->
  <div class="today-banner" id="today-banner" style="display:none">
    <div class="today-icon">📚</div>
    <div class="today-text">
      <h3 id="today-title">오늘의 수업</h3>
      <p id="today-sub">선생님이 활성화한 실험이 있어요</p>
    </div>
    <div class="today-count" id="today-count">0개 활성</div>
  </div>

  <!-- 진행도 -->
  <div class="progress-wrap" id="progress-wrap" style="display:none">
    <div class="progress-header">
      <span class="progress-label">내 학습 진행도</span>
      <span class="progress-pct" id="prog-pct">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
    <div class="progress-subs" id="prog-subs"></div>
  </div>

  <!-- 실험 목록 -->
  <div class="section-title">실험 목록</div>
  <div id="exp-loading" class="loading">
    <div class="loading-spinner"></div>
    <div>실험 목록 불러오는 중...</div>
  </div>
  <div class="exp-grid" id="exp-grid" style="display:none"></div>

  <!-- 내 기록 -->
  <div class="section-title">내 실험 기록</div>
  <div id="record-loading" class="loading" style="display:none">
    <div class="loading-spinner"></div>
  </div>
  <div class="record-list" id="record-list">
    <div class="empty-record">🔬 아직 실험 기록이 없어요<br><span style="font-size:11px">위에서 실험을 선택해 시작하세요!</span></div>
  </div>
</div>

<script>
// ══════ Firebase 설정 ══════
firebase.initializeApp({
  apiKey:"AIzaSyBX-BE14JViw82xAiA3Gts6p-SC6gVBjG8",
  authDomain:"student-literacy.firebaseapp.com",
  projectId:"student-literacy",
  storageBucket:"student-literacy.firebasestorage.app",
  messagingSenderId:"66926306937",
  appId:"1:66926306937:web:5204bff44a4cc5d62d16a8",
  measurementId:"G-CDG864KFKL"
});
const db = firebase.firestore();

// ══════ 실험 목록 ══════
// 새 실험 추가 시 여기에만 항목 추가하면 됩니다
const EXPERIMENTS = [
  {
    id:'atom-periodic',
    title:'원자 모형 & 주기율표',
    sub:'원자를 직접 조립하고 주기율표에 원소를 배치해요',
    icon:'⚛️',
    color:'#f97316',
    url:'atom-periodic-v4.html',
    tags:['[9과11-02]','원자 구조','주기율표','입자 모형'],
    collection:'atom-periodic',
    recordQuery: (col, stuId) => col.where('student.id','==',stuId).orderBy('ts','desc').limit(1)
  },
  {
    id:'element-group',
    title:'동족 원소 유사성 탐구',
    sub:'알칼리 금속과 할로겐 원소의 반응성을 비교해요',
    icon:'🧪',
    color:'#06b6d4',
    url:'element-group-v4.html',
    tags:['[9과11-03]','알칼리 금속','할로겐','반응성'],
    collection:'element-group',
    recordQuery: (col, stuId) => col.where('student.id','==',stuId).orderBy('ts','desc').limit(1)
  },
  {
    id:'sessions-acid',
    title:'산염기 적정 실험',
    sub:'산과 염기를 적정하여 중화점을 찾아요',
    icon:'⚗️',
    color:'#10b981',
    url:'acid-base-v4.html',
    tags:['[10통화01]','산염기','중화','pH'],
    collection:'sessions',
    subject: null,  // subject 필드 없는 기존 데이터
    recordQuery: (col, stuId) => col.where('studentId','==',stuId).orderBy('createdAt','desc').limit(1)
  },
  // ────────────────────────────────────────────────
  // 기체 분자 운동 (새로 추가)
  // ────────────────────────────────────────────────
  {
    id:'gas-kinetics',
    title:'기체 분자 운동',
    sub:'손 제스처로 피스톤을 조작하며 압력·온도와 부피 관계를 탐구해요',
    icon:'💨',
    color:'#7c3aed',
    url:'gas-simulator.html',
    tags:['[9과]','기체','압력과 부피','온도와 부피','입자 모형'],
    collection:'sessions',
    subject: '기체 분자 운동',  // sessions 공유 시 subject로 필터
    recordQuery: (col, stuId) => col.where('studentId','==',stuId)
                                    .where('subject','==','기체 분자 운동')
                                    .orderBy('createdAt','desc').limit(1)
  },
  // ── 이온의 이동 (추가) ──
  {
    id:'ion-migration',
    title:'이온의 이동',
    sub:'전기력으로 이온이 이동하는 현상을 관찰하고 이온이 전하를 띠고 있음을 확인해요',
    icon:'⚡',
    color:'#9333ea',
    url:'ion-migration-v2.html',
    tags:['[9과]','이온','전기력','양이온','음이온'],
    collection:'sessions',
    subject: '이온의 이동',
    recordQuery: (col, stuId) => col.where('studentId','==',stuId)
                                    .where('subject','==','이온의 이동')
                                    .orderBy('createdAt','desc').limit(1)
  },
];

// ══════ 상태 ══════
let STU = null;
let activeExps = [];
let myRecords = {};

// ══════ 로그인 ══════
function loginStudent(){
  const id = document.getElementById('s-id').value.trim();
  const name = document.getElementById('s-name').value.trim();
  const cls = document.getElementById('s-cls').value.trim();
  if(!id||!name){toast('학번과 이름을 입력하세요');return;}
  STU = {id, name, cls};
  sessionStorage.setItem('mf_stu', JSON.stringify(STU));
  showMain();
}

function showMain(){
  document.getElementById('login-wrap').style.display='none';
  document.getElementById('main').classList.add('show');
  document.getElementById('stu-badge').classList.add('show');
  document.getElementById('stu-name-hdr').textContent = STU.name;
  loadActiveExperiments();
  loadMyRecords();
}

// ══════ 활성 실험 로드 ══════
function loadActiveExperiments(){
  db.collection('settings').doc('activeExperiments')
    .onSnapshot(snap=>{
      activeExps = snap.exists ? (snap.data().active || []) : EXPERIMENTS.map(e=>e.id);
      renderExperiments();
    }, ()=>{
      activeExps = EXPERIMENTS.map(e=>e.id);
      renderExperiments();
    });
}

// ══════ 내 기록 로드 ══════
async function loadMyRecords(){
  if(!STU)return;
  document.getElementById('record-loading').style.display='block';
  myRecords = {};
  for(const exp of EXPERIMENTS){
    try{
      const col = db.collection(exp.collection);
      const snap = await exp.recordQuery(col, STU.id).get();
      if(!snap.empty) myRecords[exp.id] = snap.docs[0].data();
    }catch(e){ /* 인덱스 없을 수 있음 — 조용히 무시 */ }
  }
  document.getElementById('record-loading').style.display='none';
  renderProgress();
  renderRecords();
  renderExperiments();
}

// ══════ 실험 카드 렌더 ══════
function renderExperiments(){
  const grid = document.getElementById('exp-grid');
  document.getElementById('exp-loading').style.display='none';
  grid.style.display='grid';

  const activeCount = activeExps.length;
  if(activeCount>0){
    document.getElementById('today-banner').style.display='flex';
    document.getElementById('today-count').textContent = activeCount+'개 활성';
    document.getElementById('today-title').textContent = '오늘의 수업';
    document.getElementById('today-sub').textContent = '선생님이 '+activeCount+'개 실험을 활성화했어요';
  }

  grid.innerHTML='';
  const sorted = [...EXPERIMENTS].sort((a,b)=>{
    return activeExps.includes(b.id) - activeExps.includes(a.id);
  });

  sorted.forEach(exp=>{
    const isActive = activeExps.includes(exp.id);
    const isDone = !!myRecords[exp.id];
    const card = document.createElement('a');
    card.href = isActive ? exp.url : '#';
    card.className = 'exp-card'+(isActive?'':' inactive')+(isDone?' done':'');
    card.style.setProperty('--card-color', exp.color);
    card.innerHTML=`
      <div class="exp-card-header">
        <div class="exp-icon">${exp.icon}</div>
        <div class="exp-status ${isActive?(isDone?'status-done':'status-active'):'status-inactive'}">
          ${isActive?(isDone?'✅ 완료':'🔴 진행중'):'⏸ 대기중'}
        </div>
      </div>
      <div class="exp-title">${exp.title}</div>
      <div class="exp-sub">${exp.sub}</div>
      <div class="exp-tags">${exp.tags.map(t=>`<span class="exp-tag">${t}</span>`).join('')}</div>
      ${isDone?'<div class="exp-done-badge">✅</div>':''}
      ${!isActive?'<div class="inactive-msg">수업 시간에 활성화됩니다</div>':''}
    `;
    if(!isActive) card.onclick = e=>{ e.preventDefault(); toast('선생님이 아직 활성화하지 않은 실험이에요'); };
    grid.appendChild(card);
  });
}

// ══════ 진행도 렌더 ══════
function renderProgress(){
  const done = Object.keys(myRecords).length;
  if(done===0)return;
  document.getElementById('progress-wrap').style.display='block';
  const pct = Math.round(done/EXPERIMENTS.length*100);
  document.getElementById('prog-pct').textContent = pct+'%';
  document.getElementById('prog-fill').style.width = pct+'%';
  document.getElementById('prog-subs').innerHTML = EXPERIMENTS.map(exp=>`
    <div class="progress-sub-item">
      <div class="ps-dot" style="background:${myRecords[exp.id]?exp.color:'var(--border2)'}"></div>
      <span style="${myRecords[exp.id]?'color:var(--text)':''}">${exp.icon} ${exp.title}</span>
    </div>`).join('');
}

// ══════ 기록 렌더 ══════
function renderRecords(){
  const list = document.getElementById('record-list');
  const keys = Object.keys(myRecords);
  if(!keys.length){
    list.innerHTML='<div class="empty-record">🔬 아직 실험 기록이 없어요<br><span style="font-size:11px">위에서 실험을 선택해 시작하세요!</span></div>';
    return;
  }
  list.innerHTML='';
  EXPERIMENTS.forEach(exp=>{
    const rec = myRecords[exp.id];
    if(!rec)return;
    const mfDone = rec.mfAnswers ? rec.mfAnswers.filter(a=>a&&a!=='(건너뜀)').length : 0;
    const ts = (rec.ts||rec.createdAt)?.toDate
      ? (rec.ts||rec.createdAt).toDate().toLocaleDateString('ko-KR')
      : '최근';
    const div = document.createElement('div');
    div.className='record-item';
    div.innerHTML=`
      <div class="record-icon">${exp.icon}</div>
      <div class="record-info">
        <div class="record-title">${exp.title}</div>
        <div class="record-date">${ts} · 문해력 ${mfDone}/4단계 완료</div>
      </div>
      <div class="record-score">${mfDone}/4</div>`;
    list.appendChild(div);
  });
}

// ══════ 세션 복원 ══════
window.addEventListener('load',()=>{
  const saved = sessionStorage.getItem('mf_stu');
  if(saved){ STU=JSON.parse(saved); showMain(); }
});

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2500);}
</script>
</body>
</html>
