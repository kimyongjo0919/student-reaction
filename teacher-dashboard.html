<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>META FLOW+ | 선생님 대시보드</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
:root{--bg:#0a0e1a;--panel:#0e1520;--panel2:#111d2e;--border:#1a2840;--cyan:#00d2ff;--green:#2ed573;--yellow:#ffd32a;--red:#ff4757;--purple:#a29bfe;--text:#dde8f5;--sub:#4a6a88;--sub2:#6a8aaa;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,210,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,210,255,0.02) 1px,transparent 1px);background-size:50px 50px;pointer-events:none;}

.header{background:linear-gradient(135deg,#080c14,#0d1829);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.logo{font-family:'Orbitron',monospace;font-size:16px;font-weight:900;background:linear-gradient(90deg,var(--cyan),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.teacher-badge{background:rgba(255,211,42,0.1);border:1px solid rgba(255,211,42,0.3);border-radius:20px;padding:4px 12px;font-size:11px;color:var(--yellow);font-family:'Orbitron',monospace;letter-spacing:1px;}
.sync-badge{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,0.2);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:10px;font-family:'Orbitron',monospace;letter-spacing:1px;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--sub);}
.sync-dot.on{background:var(--green);animation:pulse 1.5s infinite;}
.sync-dot.loading{background:var(--yellow);animation:pulse 0.5s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}

.main{max-width:1400px;margin:0 auto;padding:18px 20px;}

/* 통계 카드 */
.stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px;}
@media(max-width:900px){.stats-row{grid-template-columns:repeat(3,1fr);}}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;position:relative;overflow:hidden;}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.stat-card.cyan::before{background:linear-gradient(90deg,var(--cyan),transparent);}
.stat-card.green::before{background:linear-gradient(90deg,var(--green),transparent);}
.stat-card.yellow::before{background:linear-gradient(90deg,var(--yellow),transparent);}
.stat-card.red::before{background:linear-gradient(90deg,var(--red),transparent);}
.stat-card.purple::before{background:linear-gradient(90deg,var(--purple),transparent);}
.stat-val{font-family:'Orbitron',monospace;font-size:28px;font-weight:900;display:block;margin-bottom:4px;}
.stat-label{font-size:10px;color:var(--sub2);letter-spacing:1px;}

/* 그리드 */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
@media(max-width:900px){.grid2{grid-template-columns:1fr;}}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;}
.panel-title{font-family:'Orbitron',monospace;font-size:9px;letter-spacing:3px;color:var(--sub2);text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.panel-title::before{content:'';width:12px;height:2px;background:var(--cyan);}

/* 레벨 분포 */
.ld-item{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.ld-label{font-family:'Orbitron',monospace;font-size:9px;font-weight:700;min-width:72px;}
.ld-track{flex:1;height:22px;background:rgba(255,255,255,0.04);border-radius:4px;overflow:hidden;}
.ld-bar{height:100%;border-radius:4px;transition:width 0.8s cubic-bezier(0.34,1.2,0.64,1);display:flex;align-items:center;padding-left:8px;}
.ld-bar span{font-size:10px;font-weight:700;color:rgba(0,0,0,0.7);}
.ld-count{font-family:'Orbitron',monospace;font-size:10px;font-weight:700;min-width:28px;text-align:right;}

/* 실시간 피드 */
.feed-wrap{max-height:280px;overflow-y:auto;}
.feed-wrap::-webkit-scrollbar{width:3px;}
.feed-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.feed-item{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;display:flex;align-items:center;gap:9px;margin-bottom:6px;cursor:pointer;transition:all 0.2s;animation:feedIn 0.4s ease;}
.feed-item:hover{border-color:rgba(0,210,255,0.3);}
.feed-item.new{border-color:rgba(0,210,255,0.25);background:rgba(0,210,255,0.04);}
@keyframes feedIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
.feed-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.feed-info{flex:1;min-width:0;}
.feed-name{font-size:12px;font-weight:700;margin-bottom:1px;}
.feed-exp{font-size:10px;color:var(--sub2);}
.feed-ans{font-size:9px;color:rgba(255,255,255,0.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.feed-level{padding:3px 7px;border-radius:5px;font-family:'Orbitron',monospace;font-size:8px;font-weight:700;flex-shrink:0;}
.feed-time{font-size:9px;color:var(--sub);font-family:'Orbitron',monospace;flex-shrink:0;}

/* 테이블 */
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{background:rgba(0,0,0,0.2);padding:9px 10px;text-align:left;font-size:9px;font-family:'Orbitron',monospace;letter-spacing:1px;color:var(--sub2);border-bottom:1px solid var(--border);}
td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,0.03);font-size:12px;vertical-align:middle;}
tr:hover td{background:rgba(0,210,255,0.03);}
tr:last-child td{border-bottom:none;}

.badge{padding:3px 7px;border-radius:5px;font-family:'Orbitron',monospace;font-size:8px;font-weight:700;display:inline-block;}
.level-basic{background:rgba(255,71,87,0.15);color:var(--red);}
.level-proficient{background:rgba(255,211,42,0.15);color:var(--yellow);}
.level-advanced{background:rgba(0,210,255,0.15);color:var(--cyan);}
.level-excellent{background:rgba(46,213,115,0.15);color:var(--green);}

.ans-preview{font-size:10px;color:rgba(255,255,255,0.45);max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.trend-up{color:var(--green);font-weight:700;}
.trend-dn{color:var(--red);font-weight:700;}
.trend-eq{color:var(--sub);}

/* 필터 */
.filter-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;}
.fbtn{padding:4px 10px;border-radius:15px;border:1px solid var(--border);background:transparent;color:var(--sub2);cursor:pointer;font-size:11px;transition:all 0.2s;font-family:'Noto Sans KR',sans-serif;}
.fbtn.active,.fbtn:hover{background:rgba(0,210,255,0.1);border-color:var(--cyan);color:var(--cyan);}
.search{background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:6px 10px;color:var(--text);font-size:11px;font-family:'Noto Sans KR',sans-serif;outline:none;width:140px;transition:border-color 0.2s;margin-left:auto;}
.search:focus{border-color:var(--cyan);}

/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:300;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-bg.show{display:flex;}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:22px;max-width:480px;width:100%;max-height:85vh;overflow-y:auto;}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.modal-title{font-size:15px;font-weight:700;}
.modal-x{background:none;border:none;color:var(--sub);font-size:20px;cursor:pointer;}
.modal-ans{background:rgba(0,0,0,0.2);border-radius:8px;padding:12px;font-size:12px;line-height:1.8;color:rgba(255,255,255,0.75);border-left:3px solid var(--cyan);margin-bottom:12px;}
.modal-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.mm{background:var(--panel2);border-radius:7px;padding:10px;text-align:center;}
.mm-val{font-family:'Orbitron',monospace;font-size:18px;font-weight:900;display:block;margin-bottom:2px;}
.mm-lbl{font-size:9px;color:var(--sub2);}
.modal-fb{background:rgba(46,213,115,0.05);border:1px solid rgba(46,213,115,0.15);border-radius:7px;padding:10px;font-size:11px;line-height:1.7;}
.modal-fb strong{color:var(--green);}

/* 토스트 */
.toast{position:fixed;top:70px;right:16px;background:rgba(46,213,115,0.92);color:#000;padding:10px 18px;border-radius:8px;font-size:12px;font-weight:700;opacity:0;transition:all 0.3s;pointer-events:none;z-index:400;transform:translateX(16px);}
.toast.show{opacity:1;transform:translateX(0);}

canvas{width:100%;display:block;}
.empty{text-align:center;padding:30px;color:var(--sub);font-size:12px;}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="modal-bg" id="modal" onclick="if(event.target.id==='modal')closeModal()">
  <div class="modal">
    <div class="modal-hdr">
      <div class="modal-title" id="modalTitle">상세 보기</div>
      <button class="modal-x" onclick="closeModal()">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<div class="header">
  <div style="display:flex;align-items:center;gap:12px;">
    <div class="logo">META FLOW+</div>
    <div class="teacher-badge">👨‍🏫 선생님 대시보드</div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;">
    <div class="sync-badge">
      <div class="sync-dot loading" id="syncDot"></div>
      <span id="syncText">연결 중...</span>
    </div>
    <div style="font-size:10px;color:var(--sub);font-family:'Orbitron',monospace;" id="lastUpdate"></div>
  </div>
</div>

<div class="main">

  <!-- 통계 -->
  <div class="stats-row">
    <div class="stat-card cyan"><span class="stat-val" style="color:var(--cyan)" id="sTotal">0</span><div class="stat-label">총 제출 수</div></div>
    <div class="stat-card green"><span class="stat-val" style="color:var(--green)" id="sStudents">0</span><div class="stat-label">참여 학생</div></div>
    <div class="stat-card yellow"><span class="stat-val" style="color:var(--yellow)" id="sAvgLv">-</span><div class="stat-label">평균 레벨</div></div>
    <div class="stat-card purple"><span class="stat-val" style="color:var(--purple)" id="sAvgTerm">0</span><div class="stat-label">평균 용어</div></div>
    <div class="stat-card red"><span class="stat-val" style="color:var(--red)" id="sBasic">0</span><div class="stat-label">Basic (지도필요)</div></div>
  </div>

  <div class="grid2">

    <!-- 레벨 분포 -->
    <div class="panel">
      <div class="panel-title">레벨 분포</div>
      <div id="levelDist"></div>
      <canvas id="lvChart" height="100" style="margin-top:14px;"></canvas>
    </div>

    <!-- 실시간 피드 -->
    <div class="panel">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <div class="panel-title" style="margin-bottom:0;">실시간 제출 피드</div>
        <span id="newBadge" style="display:none;background:var(--red);color:white;border-radius:10px;padding:2px 8px;font-size:10px;font-weight:700;"></span>
      </div>
      <div class="feed-wrap" id="feedWrap">
        <div class="empty">📡 Firebase 연결 중...<br>학생 답변이 실시간으로 표시됩니다</div>
      </div>
    </div>

  </div>

  <!-- 학생 테이블 -->
  <div class="panel" style="margin-bottom:14px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
      <div class="panel-title" style="margin-bottom:0;">학생 전체 현황</div>
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
        <div class="filter-row" style="margin-bottom:0;">
          <button class="fbtn active" onclick="setFilter('all',this)">전체</button>
          <button class="fbtn" onclick="setFilter('1',this)">Basic</button>
          <button class="fbtn" onclick="setFilter('2',this)">Proficient</button>
          <button class="fbtn" onclick="setFilter('3',this)">Advanced</button>
          <button class="fbtn" onclick="setFilter('4',this)">Excellent</button>
        </div>
        <input class="search" id="searchBox" placeholder="🔍 이름/학번..." oninput="renderTable()">
      </div>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th>학번</th><th>이름</th><th>학년반</th><th>실험명</th>
            <th>레벨</th><th>추이</th><th>용어</th><th>인과</th>
            <th>답변 미리보기</th><th>시간</th><th></th>
          </tr>
        </thead>
        <tbody id="tblBody"><tr><td colspan="11" class="empty">데이터 로딩 중...</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- 하단 차트 -->
  <div class="grid2">
    <div class="panel">
      <div class="panel-title">레벨별 평균 과학용어·인과관계</div>
      <canvas id="metricsChart" height="150"></canvas>
    </div>
    <div class="panel">
      <div class="panel-title">실험별 제출 현황</div>
      <canvas id="expChart" height="150"></canvas>
    </div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, orderBy, onSnapshot, query }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBX-BE14JViw82xAiA3Gts6p-SC6gVBjG8",
  authDomain: "student-literacy.firebaseapp.com",
  projectId: "student-literacy",
  storageBucket: "student-literacy.firebasestorage.app",
  messagingSenderId: "66926306937",
  appId: "1:66926306937:web:5204bff44a4cc5d62d16a8"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let all = [], filter = 'all', isFirst = true, newCnt = 0;

// Firebase 실시간
const q = query(collection(db, 'sessions'), orderBy('createdAt','desc'));
onSnapshot(q, snap => {
  document.getElementById('syncDot').className = 'sync-dot on';
  document.getElementById('syncText').textContent = '실시간 연결';
  document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('ko');

  all = [];
  snap.forEach(d => all.push({id:d.id,...d.data()}));

  const changes = snap.docChanges().filter(c=>c.type==='added');
  if (!isFirst && changes.length) {
    newCnt += changes.length;
    document.getElementById('newBadge').textContent = '🔴 ' + newCnt + '개 새 답변';
    document.getElementById('newBadge').style.display = 'inline-block';
    const d = changes[0].doc.data();
    showToast(`📩 ${d.studentName} 학생이 답변 제출!`);
    prependFeed(changes.map(c=>({id:c.doc.id,...c.doc.data()})));
  } else if (isFirst) {
    renderFeed(all.slice(0,10));
    isFirst = false;
  }

  renderStats();
  renderTable();
  renderCharts();
}, err => {
  document.getElementById('syncDot').className = 'sync-dot';
  document.getElementById('syncText').textContent = '연결 오류';
});

// 통계
function renderStats() {
  const total = all.length;
  const students = new Set(all.map(s=>s.studentId)).size;
  const avgLv = total ? (all.reduce((a,s)=>a+(s.level||1),0)/total).toFixed(1) : '-';
  const avgTerm = total ? Math.round(all.reduce((a,s)=>a+(s.terms||0),0)/total) : 0;
  const basic = all.filter(s=>(s.level||1)===1).length;

  anim('sTotal',total); anim('sStudents',students);
  document.getElementById('sAvgLv').textContent = avgLv;
  anim('sAvgTerm',avgTerm); anim('sBasic',basic);

  // 레벨 분포 바
  const cnt = {1:0,2:0,3:0,4:0};
  all.forEach(s=>cnt[s.level||1]++);
  const max = Math.max(...Object.values(cnt),1);
  const items = [
    {l:4,name:'Excellent',color:'linear-gradient(90deg,#2ed573,#00d2ff)',tc:'var(--green)'},
    {l:3,name:'Advanced',color:'linear-gradient(90deg,#00d2ff,#a29bfe)',tc:'var(--cyan)'},
    {l:2,name:'Proficient',color:'linear-gradient(90deg,#ffd32a,#ff9f43)',tc:'var(--yellow)'},
    {l:1,name:'Basic',color:'linear-gradient(90deg,#ff4757,#ff6b81)',tc:'var(--red)'},
  ];
  document.getElementById('levelDist').innerHTML = items.map(it=>`
    <div class="ld-item">
      <div class="ld-label" style="color:${it.tc}">${it.name}</div>
      <div class="ld-track">
        <div class="ld-bar" style="width:${Math.round(cnt[it.l]/max*100)}%;background:${it.color};">
          <span>${cnt[it.l]>0?cnt[it.l]+'명':''}</span>
        </div>
      </div>
      <div class="ld-count" style="color:${it.tc}">${cnt[it.l]}명</div>
    </div>
  `).join('');

  drawLvChart(cnt);
}

// 피드
function renderFeed(items) {
  const w = document.getElementById('feedWrap');
  if(!items.length){w.innerHTML='<div class="empty">📡 아직 제출이 없어요</div>';return;}
  w.innerHTML = items.map(s=>feedHtml(s,false)).join('');
}
function prependFeed(items) {
  const w = document.getElementById('feedWrap');
  if(w.querySelector('.empty')) w.innerHTML='';
  items.forEach(s=>{
    const div=document.createElement('div');
    div.innerHTML=feedHtml(s,true);
    w.insertBefore(div.firstChild,w.firstChild);
  });
}
function feedHtml(s,isNew) {
  return `<div class="feed-item${isNew?' new':''}" onclick='showDetail(${JSON.stringify(s).replace(/'/g,"\\'")})'> 
    <div class="feed-avatar" style="background:${lvColor(s.level||1)}22">${lvEmoji(s.level||1)}</div>
    <div class="feed-info">
      <div class="feed-name">${s.studentName||'-'} <span style="color:var(--sub);font-size:10px">${s.studentClass||''}</span></div>
      <div class="feed-exp">${s.experimentName||''}</div>
      <div class="feed-ans">"${s.answer||''}"</div>
    </div>
    <div class="feed-level level-${lvClass(s.level||1)}">${lvShort(s.level||1)}</div>
    <div class="feed-time">${fmtTime(s.createdAt)}</div>
  </div>`;
}

// 테이블
function renderTable() {
  const search = document.getElementById('searchBox').value.toLowerCase();
  const latestMap = new Map();
  const prevMap = new Map();
  all.forEach(s=>{
    if(!latestMap.has(s.studentId)) latestMap.set(s.studentId,s);
    else prevMap.set(s.studentId, latestMap.get(s.studentId));
  });
  let rows = Array.from(latestMap.values());
  if(filter!=='all') rows=rows.filter(s=>String(s.level||1)===filter);
  if(search) rows=rows.filter(s=>(s.studentName||'').toLowerCase().includes(search)||(s.studentId||'').includes(search));

  const body = document.getElementById('tblBody');
  if(!rows.length){body.innerHTML='<tr><td colspan="11" class="empty">해당 학생 없음</td></tr>';return;}

  body.innerHTML = rows.map(s=>{
    const prev=prevMap.get(s.studentId);
    const cl=s.level||1, pl=prev?.level||cl;
    const tr=cl>pl?'↑':cl<pl?'↓':'→';
    const tc=cl>pl?'trend-up':cl<pl?'trend-dn':'trend-eq';
    return `<tr onclick='showDetail(${JSON.stringify(s).replace(/'/g,"\\'")})'  style="cursor:pointer;">
      <td style="font-family:'Orbitron',monospace;font-size:10px">${s.studentId||'-'}</td>
      <td><strong>${s.studentName||'-'}</strong></td>
      <td style="color:var(--sub2);font-size:11px">${s.studentClass||'-'}</td>
      <td style="font-size:11px">${s.experimentName||'-'}</td>
      <td><span class="badge level-${lvClass(cl)}">${lvName(cl)}</span></td>
      <td><span class="${tc}">${tr}</span></td>
      <td style="font-family:'Orbitron',monospace;color:var(--cyan)">${s.terms||0}</td>
      <td style="font-family:'Orbitron',monospace;color:var(--green)">${s.causal||0}</td>
      <td><div class="ans-preview">${s.answer||'-'}</div></td>
      <td style="font-size:10px;color:var(--sub2);font-family:'Orbitron',monospace">${fmtTime(s.createdAt)}</td>
      <td><button onclick="event.stopPropagation();showDetail(${JSON.stringify(s).replace(/'/g,"\\'")})" style="padding:3px 8px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--sub2);cursor:pointer;font-size:10px;">상세</button></td>
    </tr>`;
  }).join('');
}

// 차트들
function drawLvChart(cnt) {
  const cv=document.getElementById('lvChart');
  if(!cv) return;
  const dpr=window.devicePixelRatio||1;
  cv.width=cv.offsetWidth*dpr; cv.height=100*dpr;
  const ctx=cv.getContext('2d');
  ctx.scale(dpr,dpr);
  const W=cv.offsetWidth,H=100;
  ctx.clearRect(0,0,W,H);
  const data=[{l:'Basic',v:cnt[1],c:'#ff4757'},{l:'Prof',v:cnt[2],c:'#ffd32a'},{l:'Adv',v:cnt[3],c:'#00d2ff'},{l:'Excel',v:cnt[4],c:'#2ed573'}];
  const max=Math.max(...data.map(d=>d.v),1);
  const bW=(W-40)/data.length;
  data.forEach((d,i)=>{
    const x=20+i*bW+bW*0.1,w=bW*0.8;
    const h=Math.max(((d.v/max)*(H-30)),2),y=H-24-h;
    const g=ctx.createLinearGradient(0,y,0,H-24);
    g.addColorStop(0,d.c);g.addColorStop(1,d.c+'33');
    ctx.fillStyle=g;ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(x,y,w,h,[3,3,0,0]);
    else ctx.rect(x,y,w,h);
    ctx.fill();
    if(d.v>0){ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='bold 9px Orbitron,monospace';ctx.textAlign='center';ctx.fillText(d.v,x+w/2,y-3);}
    ctx.fillStyle='rgba(150,180,210,0.7)';ctx.font='8px Noto Sans KR,sans-serif';ctx.textAlign='center';ctx.fillText(d.l,x+w/2,H-6);
  });
}

function renderCharts() {
  // 레벨별 지표
  const cv=document.getElementById('metricsChart');
  if(cv){
    const dpr=window.devicePixelRatio||1;
    cv.width=cv.offsetWidth*dpr;cv.height=150*dpr;
    const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
    const W=cv.offsetWidth,H=150;ctx.clearRect(0,0,W,H);
    const pL=35,pR=10,pT=18,pB=28,cW=W-pL-pR,cH=H-pT-pB;
    const ldata=[1,2,3,4].map(l=>{
      const items=all.filter(s=>(s.level||1)===l);
      return{l,terms:items.length?(items.reduce((a,s)=>a+(s.terms||0),0)/items.length).toFixed(1):0,causal:items.length?(items.reduce((a,s)=>a+(s.causal||0),0)/items.length).toFixed(1):0};
    });
    const max=6,labels=['Basic','Prof','Adv','Excel'],colors=['#ff4757','#ffd32a','#00d2ff','#2ed573'];
    for(let i=0;i<=max;i+=2){const y=pT+cH-(i/max)*cH;ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pL,y);ctx.lineTo(W-pR,y);ctx.stroke();ctx.fillStyle='rgba(100,130,160,0.6)';ctx.font='8px Orbitron,monospace';ctx.textAlign='right';ctx.fillText(i,pL-3,y+3);}
    ldata.forEach((d,i)=>{
      const gX=pL+i*(cW/4),bW=(cW/4)*0.38;
      [{v:d.terms,c:'rgba(0,210,255,0.7)',ox:0},{v:d.causal,c:'rgba(46,213,115,0.7)',ox:bW+4}].forEach(m=>{
        const bH=Math.max((parseFloat(m.v)/max)*cH,1),bY=pT+cH-bH;
        ctx.fillStyle=m.c;ctx.beginPath();
        if(ctx.roundRect)ctx.roundRect(gX+gX*0+m.ox+(cW/4)*0.1,bY,bW,bH,[2,2,0,0]);
        else ctx.rect(gX+(cW/4)*0.1+m.ox,bY,bW,bH);
        ctx.fill();
        if(parseFloat(m.v)>0){ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='7px Orbitron,monospace';ctx.textAlign='center';ctx.fillText(m.v,gX+(cW/4)*0.1+m.ox+bW/2,bY-3);}
      });
      ctx.fillStyle=colors[i];ctx.font='8px Noto Sans KR,sans-serif';ctx.textAlign='center';ctx.fillText(labels[i],gX+(cW/4)*0.5,H-8);
    });
    // 범례
    [['과학용어','rgba(0,210,255,0.7)'],['인과관계','rgba(46,213,115,0.7)']].forEach(([l,c],i)=>{ctx.fillStyle=c;ctx.fillRect(pL+i*55,4,8,7);ctx.fillStyle='rgba(150,180,210,0.8)';ctx.font='8px Noto Sans KR,sans-serif';ctx.textAlign='left';ctx.fillText(l,pL+i*55+10,11);});
  }

  // 실험별
  const cv2=document.getElementById('expChart');
  if(cv2){
    const dpr=window.devicePixelRatio||1;
    cv2.width=cv2.offsetWidth*dpr;cv2.height=150*dpr;
    const ctx=cv2.getContext('2d');ctx.scale(dpr,dpr);
    const W=cv2.offsetWidth,H=150;ctx.clearRect(0,0,W,H);
    const expMap=new Map();
    all.forEach(s=>{const k=s.experimentName||'기타';expMap.set(k,(expMap.get(k)||0)+1);});
    const exps=Array.from(expMap.entries()).slice(0,5);
    if(!exps.length){ctx.fillStyle='rgba(100,130,160,0.5)';ctx.font='12px Noto Sans KR,sans-serif';ctx.textAlign='center';ctx.fillText('데이터 없음',W/2,H/2);return;}
    const max=Math.max(...exps.map(e=>e[1]),1);
    const pL=10,pR=10,pT=10,pB=10,cH=H-pT-pB;
    const bH=(cH-exps.length*4)/exps.length;
    const colors2=['#00d2ff','#2ed573','#ffd32a','#ff4757','#a29bfe'];
    exps.forEach(([name,cnt],i)=>{
      const y=pT+i*(bH+4);
      const bW=Math.max((cnt/max)*(W-pL-pR-80),4);
      const g=ctx.createLinearGradient(pL,0,pL+bW,0);
      g.addColorStop(0,colors2[i]);g.addColorStop(1,colors2[i]+'44');
      ctx.fillStyle=g;ctx.beginPath();
      if(ctx.roundRect)ctx.roundRect(pL,y,bW,bH,[3]);
      else ctx.rect(pL,y,bW,bH);
      ctx.fill();
      ctx.fillStyle='rgba(150,180,210,0.8)';ctx.font='9px Noto Sans KR,sans-serif';ctx.textAlign='left';
      ctx.fillText(name.substring(0,8),pL+bW+6,y+bH/2+3);
      ctx.fillStyle=colors2[i];ctx.font='bold 9px Orbitron,monospace';ctx.textAlign='right';
      ctx.fillText(cnt+'회',W-pR,y+bH/2+3);
    });
  }
}

// 상세 모달
window.showDetail = function(s) {
  if(typeof s==='string') s=JSON.parse(s);
  document.getElementById('modalTitle').textContent=`${s.studentName} · ${s.experimentName}`;
  document.getElementById('modalBody').innerHTML=`
    <div class="modal-ans">"${s.answer}"</div>
    <div class="modal-metrics">
      <div class="mm"><span class="mm-val" style="color:var(--cyan)">${s.terms||0}개</span><span class="mm-lbl">과학 용어</span></div>
      <div class="mm"><span class="mm-val" style="color:var(--green)">${s.causal||0}개</span><span class="mm-lbl">인과관계</span></div>
      <div class="mm"><span class="mm-val" style="color:var(--yellow)">${s.sentences||0}개</span><span class="mm-lbl">문장 수</span></div>
    </div>
    <div class="modal-fb"><strong>🤖 AI 피드백</strong><br>${s.feedback||'분석 중...'}</div>
    <div style="margin-top:10px;font-size:10px;color:var(--sub2);font-family:'Orbitron',monospace;">
      레벨: ${lvName(s.level||1)} · 제출: ${fmtTime(s.createdAt)} · 학번: ${s.studentId}
    </div>
  `;
  document.getElementById('modal').classList.add('show');
};

window.closeModal=()=>document.getElementById('modal').classList.remove('show');
window.setFilter=(f,btn)=>{filter=f;document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderTable();};
window.renderTable=renderTable;

// 유틸
function lvName(l){return{1:'Basic',2:'Proficient',3:'Advanced',4:'Excellent'}[l]||'Basic';}
function lvShort(l){return{1:'BAS',2:'PRO',3:'ADV',4:'EXC'}[l]||'-';}
function lvClass(l){return{1:'basic',2:'proficient',3:'advanced',4:'excellent'}[l]||'basic';}
function lvColor(l){return{1:'#ff4757',2:'#ffd32a',3:'#00d2ff',4:'#2ed573'}[l]||'#ff4757';}
function lvEmoji(l){return{1:'😐',2:'🙂',3:'😊',4:'🌟'}[l]||'😐';}
function fmtTime(ts){if(!ts)return'-';try{const d=ts.toDate?ts.toDate():new Date(ts);return(d.getMonth()+1)+'/'+(d.getDate())+' '+d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}catch{return'-';}}
function anim(id,target){const el=document.getElementById(id);if(!el)return;let c=parseInt(el.textContent)||0;if(c===target)return;const step=(target-c)/20;const t=setInterval(()=>{c=Math.min(c+step,target);el.textContent=Math.round(c);if(Math.round(c)>=target){el.textContent=target;clearInterval(t);}},30);}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
window.addEventListener('resize',renderCharts);
</script>
