<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>META FLOW+ | 선생님 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&family=Bebas+Neue&family=Orbitron:wght@700;900&family=Exo+2:wght@700;900&family=Rajdhani:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #0066ff;
  --primary-light: #e8f0ff;
  --primary-mid: #c2d4ff;
  --secondary: #00b4d8;
  --secondary-light: #e0f7fc;
  --accent: #ff6b35;
  --accent-light: #fff0eb;
  --success: #00c896;
  --success-light: #e0faf3;
  --warning: #ffb300;
  --warning-light: #fff8e0;
  --danger: #ff4560;
  --danger-light: #ffe8ec;
  --gray-50: #f8faff;
  --gray-100: #f0f4ff;
  --gray-200: #e2e8f7;
  --gray-300: #c8d3ec;
  --gray-400: #8898bb;
  --gray-500: #5a6a8a;
  --gray-700: #2d3a5a;
  --gray-900: #0d1535;
  --white: #ffffff;
  --shadow-sm: 0 2px 8px rgba(0,102,255,0.06);
  --shadow-md: 0 4px 20px rgba(0,102,255,0.10);
  --shadow-lg: 0 8px 40px rgba(0,102,255,0.14);
  --radius: 14px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Pretendard', sans-serif;
  background: var(--gray-50);
  color: var(--gray-700);
  min-height: 100vh;
  position: relative;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    radial-gradient(circle at 20% 20%, rgba(0,102,255,0.04) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(0,180,216,0.04) 0%, transparent 50%),
    linear-gradient(rgba(0,102,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,102,255,0.015) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
  pointer-events: none; z-index: 0;
}
.header {
  background: white;
  border-bottom: 1px solid var(--gray-200);
  padding: 0 28px;
  height: 80px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 1px 0 var(--gray-200), 0 4px 16px rgba(0,102,255,0.06);
}
.header-left { display: flex; align-items: center; gap: 20px; }
.logo {
  font-family: 'Exo 2', sans-serif;
  font-size: 28px; font-weight: 900;
  color: var(--primary);
  letter-spacing: 2px;
  display: flex; align-items: center; gap: 12px;
  text-shadow: 0 2px 12px rgba(0,102,255,0.15);
}
.logo-icon { width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;font-size:22px; }
.teacher-chip { background:var(--primary-light);color:var(--primary);border:1px solid var(--primary-mid);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:600;letter-spacing:0.5px; }
.header-right { display: flex; align-items: center; gap: 12px; }
.sync-pill { display:flex;align-items:center;gap:6px;background:var(--gray-100);border:1px solid var(--gray-200);border-radius:20px;padding:5px 12px;font-size:11px;font-weight:600;color:var(--gray-500);font-family:'Space Mono',monospace; }
.sync-dot { width:7px;height:7px;border-radius:50%;background:var(--gray-300); }
.sync-dot.on { background:var(--success);animation:pulse 2s infinite; }
.sync-dot.loading { background:var(--warning);animation:pulse 0.6s infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(0.8)} }
.time-chip { font-family:'Space Mono',monospace;font-size:11px;color:var(--gray-400); }
.main { max-width:1440px;margin:0 auto;padding:24px 28px;position:relative;z-index:1; }

/* ── 실험 활성화 토글 섹션 ── */
.exp-toggle-row { display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px; }
@media(max-width:900px){.exp-toggle-row{grid-template-columns:1fr}}
.exp-toggle-card { background:white;border:1.5px solid var(--gray-200);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm);transition:all .2s;position:relative;overflow:hidden; }
.exp-toggle-card::after { content:'';position:absolute;bottom:0;left:0;right:0;height:3px;border-radius:0 0 var(--radius) var(--radius); }
.exp-toggle-card.active-card { border-color:var(--primary);background:var(--primary-light); }
.exp-toggle-card.active-card::after { background:linear-gradient(90deg,var(--primary),var(--secondary)); }
.etc-header { display:flex;align-items:center;gap:10px;margin-bottom:8px; }
.etc-icon { font-size:22px; }
.etc-info { flex:1; }
.etc-title { font-size:13px;font-weight:700;color:var(--gray-700); }
.etc-sub { font-size:11px;color:var(--gray-400);margin-top:2px; }
.toggle-wrap { display:flex;align-items:center;gap:8px; }
.toggle-lbl { font-size:11px;font-weight:700; }
.toggle { width:46px;height:26px;background:var(--gray-200);border-radius:13px;border:none;cursor:pointer;position:relative;transition:.3s;flex-shrink:0; }
.toggle.on { background:var(--primary); }
.toggle::after { content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:white;transition:.3s;box-shadow:0 1px 4px rgba(0,0,0,.2); }
.toggle.on::after { left:23px; }
.etc-stats { display:flex;gap:8px;margin-top:10px;flex-wrap:wrap; }
.etc-stat { font-size:10px;padding:3px 8px;border-radius:5px;background:var(--gray-100);color:var(--gray-500);font-weight:600; }
.etc-stat.hl { background:rgba(0,102,255,.1);color:var(--primary); }

/* ── 통계 카드 ── */
.stats-grid { display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px; }
@media(max-width:1100px){.stats-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
.stat-card { background:white;border:1px solid var(--gray-200);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:all .2s; }
.stat-card:hover { transform:translateY(-2px);box-shadow:var(--shadow-md); }
.stat-card::after { content:'';position:absolute;bottom:0;left:0;right:0;height:3px;border-radius:0 0 var(--radius) var(--radius); }
.stat-card.blue::after{background:linear-gradient(90deg,var(--primary),var(--secondary))}
.stat-card.green::after{background:linear-gradient(90deg,var(--success),#00e5b0)}
.stat-card.yellow::after{background:linear-gradient(90deg,var(--warning),#ffcc33)}
.stat-card.orange::after{background:linear-gradient(90deg,var(--accent),#ff9a5c)}
.stat-card.red::after{background:linear-gradient(90deg,var(--danger),#ff7a90)}
.stat-icon { width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:10px; }
.stat-card.blue .stat-icon{background:var(--primary-light)}
.stat-card.green .stat-icon{background:var(--success-light)}
.stat-card.yellow .stat-icon{background:var(--warning-light)}
.stat-card.orange .stat-icon{background:var(--accent-light)}
.stat-card.red .stat-icon{background:var(--danger-light)}
.stat-val { font-family:'Space Mono',monospace;font-size:28px;font-weight:700;display:block;margin-bottom:3px;line-height:1; }
.stat-card.blue .stat-val{color:var(--primary)} .stat-card.green .stat-val{color:var(--success)}
.stat-card.yellow .stat-val{color:var(--warning)} .stat-card.orange .stat-val{color:var(--accent)}
.stat-card.red .stat-val{color:var(--danger)}
.stat-label { font-size:11px;color:var(--gray-400);font-weight:500;letter-spacing:.3px; }

/* ── 탭 (실험 선택) ── */
.exp-tabs { display:flex;gap:0;border-bottom:2px solid var(--gray-200);margin-bottom:16px; }
.exp-tab { padding:10px 18px;font-size:13px;font-weight:700;color:var(--gray-400);border-bottom:2px solid transparent;cursor:pointer;transition:.2s;margin-bottom:-2px;display:flex;align-items:center;gap:6px; }
.exp-tab:hover{color:var(--gray-700)}
.exp-tab.active{color:var(--primary);border-color:var(--primary)}
.exp-tab .tab-cnt{font-size:10px;background:var(--gray-100);color:var(--gray-500);border-radius:10px;padding:1px 6px;font-family:'Space Mono',monospace}
.exp-tab.active .tab-cnt{background:var(--primary-light);color:var(--primary)}

/* ── 패널 ── */
.grid2 { display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px; }
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.panel { background:white;border:1px solid var(--gray-200);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm); }
.panel-header { display:flex;align-items:center;justify-content:space-between;margin-bottom:16px; }
.panel-title { font-size:13px;font-weight:700;color:var(--gray-700);display:flex;align-items:center;gap:8px; }
.panel-title .pt-dot { width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary)); }
.level-bars{display:flex;flex-direction:column;gap:10px}
.lb-item{display:flex;align-items:center;gap:10px}
.lb-label{font-size:11px;font-weight:700;min-width:76px;font-family:'Space Mono',monospace}
.lb-track{flex:1;height:24px;background:var(--gray-100);border-radius:6px;overflow:hidden}
.lb-fill{height:100%;border-radius:6px;display:flex;align-items:center;padding-left:10px;transition:width .9s cubic-bezier(.34,1.56,.64,1)}
.lb-fill span{font-size:11px;font-weight:700;color:white;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.lb-count{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;min-width:28px;text-align:right}
.feed-scroll{max-height:280px;overflow-y:auto}
.feed-scroll::-webkit-scrollbar{width:4px}
.feed-scroll::-webkit-scrollbar-track{background:var(--gray-100);border-radius:2px}
.feed-scroll::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:2px}
.feed-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--gray-50);border:1px solid var(--gray-100);margin-bottom:6px;cursor:pointer;transition:all .2s;animation:slideIn .35s ease}
.feed-item:hover{background:var(--primary-light);border-color:var(--primary-mid)}
.feed-item.new{background:#fffbf0;border-color:#ffe0a0}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.feed-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;background:var(--gray-100)}
.feed-info{flex:1;min-width:0}
.feed-name{font-size:12px;font-weight:700;color:var(--gray-700);margin-bottom:1px}
.feed-exp{font-size:10px;color:var(--gray-400)}
.feed-ans{font-size:10px;color:var(--gray-400);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.feed-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.level-chip{padding:2px 8px;border-radius:10px;font-size:9px;font-weight:700;letter-spacing:.5px;font-family:'Space Mono',monospace}
.chip-basic{background:var(--danger-light);color:var(--danger)}
.chip-proficient{background:var(--warning-light);color:var(--warning)}
.chip-advanced{background:var(--primary-light);color:var(--primary)}
.chip-excellent{background:var(--success-light);color:var(--success)}
.feed-time{font-size:9px;color:var(--gray-400);font-family:'Space Mono',monospace}
.new-badge{background:var(--accent);color:white;border-radius:10px;padding:2px 8px;font-size:10px;font-weight:700;display:none;margin-left:6px;animation:bounce 1s infinite}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{padding:9px 12px;text-align:left;font-size:10px;font-weight:700;color:var(--gray-400);letter-spacing:.8px;text-transform:uppercase;border-bottom:2px solid var(--gray-200);background:var(--gray-50)}
td{padding:10px 12px;border-bottom:1px solid var(--gray-100);font-size:12px;vertical-align:middle}
tr:hover td{background:var(--primary-light)}
tr:last-child td{border-bottom:none}
.ans-preview{font-size:11px;color:var(--gray-400);max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trend-up{color:var(--success);font-weight:700} .trend-dn{color:var(--danger);font-weight:700} .trend-eq{color:var(--gray-400)}
.filter-row{display:flex;gap:5px;flex-wrap:wrap}
.fbtn{padding:5px 12px;border-radius:20px;border:1.5px solid var(--gray-200);background:white;color:var(--gray-500);cursor:pointer;font-size:11px;font-weight:600;transition:all .15s;font-family:'Pretendard',sans-serif}
.fbtn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
.fbtn.active{background:var(--primary);border-color:var(--primary);color:white}
.search-box{background:var(--gray-50);border:1.5px solid var(--gray-200);border-radius:8px;padding:6px 12px;color:var(--gray-700);font-size:12px;font-family:'Pretendard',sans-serif;outline:none;width:150px;transition:border-color .2s}
.search-box:focus{border-color:var(--primary);background:white}
canvas{width:100%;display:block}
.modal-bg{position:fixed;inset:0;background:rgba(13,21,53,.5);backdrop-filter:blur(4px);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:white;border-radius:20px;padding:28px;max-width:500px;width:100%;box-shadow:0 20px 60px rgba(0,102,255,.15);animation:modalIn .3s cubic-bezier(.34,1.56,.64,1);max-height:85vh;overflow-y:auto}
@keyframes modalIn{from{opacity:0;transform:scale(.92) translateY(16px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-title{font-size:16px;font-weight:700;color:var(--gray-900)}
.modal-x{background:var(--gray-100);border:none;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px;color:var(--gray-500);display:flex;align-items:center;justify-content:center;transition:all .15s}
.modal-x:hover{background:var(--danger-light);color:var(--danger)}
.modal-ans{background:var(--primary-light);border:1px solid var(--primary-mid);border-radius:10px;padding:14px;font-size:13px;line-height:1.8;color:var(--gray-700);border-left:4px solid var(--primary);margin-bottom:14px}
.modal-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.mm{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:10px;padding:12px;text-align:center}
.mm-val{font-family:'Space Mono',monospace;font-size:20px;font-weight:700;display:block;margin-bottom:3px}
.mm-lbl{font-size:10px;color:var(--gray-400)}
.modal-fb{background:var(--success-light);border:1px solid #a0f0d8;border-radius:10px;padding:12px;font-size:12px;line-height:1.7;color:var(--gray-700)}
.modal-fb strong{color:var(--success)}
.mf-answer-block{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:10px;padding:12px;margin-bottom:8px}
.mf-step-label{font-size:10px;font-weight:700;color:var(--primary);letter-spacing:.5px;margin-bottom:5px;text-transform:uppercase}
.mf-step-text{font-size:13px;line-height:1.65;color:var(--gray-700)}
.mf-step-empty{font-size:12px;color:var(--gray-400);font-style:italic}
.toast{position:fixed;top:76px;right:20px;background:var(--gray-900);color:white;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;transform:translateX(20px);z-index:400;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px}
.toast.show{opacity:1;transform:translateX(0)}
.empty{text-align:center;padding:32px 20px;color:var(--gray-400);font-size:13px}
.empty-icon{font-size:36px;margin-bottom:8px}
.detail-btn{padding:4px 10px;border-radius:6px;border:1px solid var(--gray-200);background:white;color:var(--gray-500);cursor:pointer;font-size:10px;font-weight:600;transition:all .15px;font-family:'Pretendard',sans-serif}
.detail-btn:hover{background:var(--primary);border-color:var(--primary);color:white}
.theme-btn{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:all .2s;flex-shrink:0}
.theme-btn:hover{transform:scale(1.15)}
.theme-btn.active{border-color:#111;box-shadow:0 0 0 2px white,0 0 0 4px #111}
.theme-panel{position:fixed;top:90px;right:20px;background:white;border:1px solid var(--gray-200);border-radius:16px;padding:22px;box-shadow:0 8px 40px rgba(0,0,0,.14);z-index:200;width:300px;display:none;animation:modalIn .25s ease;max-height:85vh;overflow-y:auto}
.theme-panel.show{display:block}
.tp-title{font-size:13px;font-weight:700;color:#111;margin-bottom:14px}
.tp-section{margin-bottom:16px}
.tp-label{font-size:11px;font-weight:600;color:#555;margin-bottom:8px;letter-spacing:.5px}
.tp-colors{display:flex;gap:8px;flex-wrap:wrap}
.tp-row{display:flex;align-items:center;gap:10px}
.tp-input{flex:1;padding:7px 10px;border:1.5px solid var(--gray-200);border-radius:8px;font-size:12px;font-family:'Pretendard',sans-serif;outline:none;color:#111}
.tp-input:focus{border-color:var(--primary)}
.tp-apply{width:100%;padding:10px;background:var(--primary);color:white;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Pretendard',sans-serif;transition:all .15s}
.tp-apply:hover{opacity:.85}
</style>
</head>
<body>

<!-- 테마 패널 -->
<div class="theme-panel" id="themePanel">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
    <div class="tp-title">🎨 테마 커스터마이저</div>
    <button onclick="toggleTheme()" style="background:none;border:none;font-size:18px;cursor:pointer;color:#555">✕</button>
  </div>
  <div class="tp-section">
    <div class="tp-label">⚡ 프리셋 테마</div>
    <div class="tp-colors">
      <div class="theme-btn active" style="background:linear-gradient(135deg,#0066ff,#00b4d8)" onclick="applyPreset('blue',this)" title="오션 블루"></div>
      <div class="theme-btn" style="background:linear-gradient(135deg,#7c3aed,#a855f7)" onclick="applyPreset('purple',this)" title="퍼플"></div>
      <div class="theme-btn" style="background:linear-gradient(135deg,#059669,#10b981)" onclick="applyPreset('green',this)" title="그린"></div>
      <div class="theme-btn" style="background:linear-gradient(135deg,#dc2626,#f97316)" onclick="applyPreset('red',this)" title="레드"></div>
      <div class="theme-btn" style="background:linear-gradient(135deg,#0891b2,#0e7490)" onclick="applyPreset('teal',this)" title="틸"></div>
      <div class="theme-btn" style="background:linear-gradient(135deg,#1e293b,#374151)" onclick="applyPreset('dark',this)" title="다크"></div>
    </div>
  </div>
  <div class="tp-section">
    <div class="tp-label">🎨 메인 색상</div>
    <div class="tp-row">
      <input type="color" id="colorPicker" value="#0066ff" style="width:44px;height:36px;border-radius:8px;border:1.5px solid #ddd;cursor:pointer;padding:2px">
      <input class="tp-input" id="colorHex" value="#0066ff" placeholder="#0066ff" maxlength="7">
    </div>
  </div>
  <div class="tp-section">
    <div class="tp-label">🏫 학교/학급 이름</div>
    <input class="tp-input" id="schoolName" placeholder="예) 광남고등학교 2학년 3반" style="width:100%">
  </div>
  <button class="tp-apply" onclick="applyTheme()">✅ 적용하기</button>
  <button onclick="resetTheme()" style="width:100%;padding:8px;background:none;border:1px solid #ddd;border-radius:8px;font-size:12px;color:#888;cursor:pointer;margin-top:6px;font-family:'Pretendard',sans-serif">↩️ 기본값으로</button>
</div>

<div class="toast" id="toast"></div>

<div class="modal-bg" id="modal" onclick="if(event.target.id==='modal')closeModal()">
  <div class="modal">
    <div class="modal-hdr">
      <div class="modal-title" id="modalTitle">상세 보기</div>
      <button class="modal-x" onclick="closeModal()">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<!-- 헤더 -->
<div class="header">
  <div class="header-left">
    <div class="logo">
      <div class="logo-icon">⚗️</div>
      META FLOW+
    </div>
    <div class="teacher-chip">👨‍🏫 선생님 대시보드</div>
    <div id="schoolChip" style="font-size:13px;font-weight:600;color:#555"></div>
  </div>
  <div class="header-right">
    <button onclick="toggleTheme()" style="display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:20px;border:1.5px solid var(--gray-200);background:white;cursor:pointer;font-size:13px;font-weight:600;color:#333;transition:all .15s">🎨 테마</button>
    <div class="sync-pill">
      <div class="sync-dot loading" id="syncDot"></div>
      <span id="syncText">연결 중...</span>
    </div>
    <div class="time-chip" id="lastUpdate">--:--:--</div>
  </div>
</div>

<div class="main">

  <!-- 실험 활성화 토글 -->
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
    <div style="font-size:13px;font-weight:700;color:var(--gray-700)">📡 오늘의 실험 활성화</div>
    <div style="font-size:11px;color:var(--gray-400)">토글로 학생 화면에 표시/숨김</div>
  </div>
  <div class="exp-toggle-row" id="toggleRow"></div>

  <!-- 통계 카드 -->
  <div class="stats-grid">
    <div class="stat-card blue"><div class="stat-icon">📊</div><span class="stat-val" id="sTotal">0</span><div class="stat-label">총 제출 수</div></div>
    <div class="stat-card green"><div class="stat-icon">👨‍🎓</div><span class="stat-val" id="sStudents">0</span><div class="stat-label">참여 학생 수</div></div>
    <div class="stat-card yellow"><div class="stat-icon">📈</div><span class="stat-val" id="sAvgLv">-</span><div class="stat-label">평균 문해력 단계</div></div>
    <div class="stat-card orange"><div class="stat-icon">🔬</div><span class="stat-val" id="sExpCnt">0</span><div class="stat-label">활성 실험 수</div></div>
    <div class="stat-card red"><div class="stat-icon">⚠️</div><span class="stat-val" id="sBasic">0</span><div class="stat-label">1단계만 완료</div></div>
  </div>

  <!-- 실험별 탭 -->
  <div class="panel" style="margin-bottom:16px">
    <div class="exp-tabs" id="expTabs"></div>
    <div id="expTabPanels"></div>
  </div>

  <!-- 레벨분포 + 실시간 피드 -->
  <div class="grid2">
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title"><div class="pt-dot"></div>레벨 분포</div>
        <span id="totalBadge" style="font-size:11px;color:var(--gray-400);font-family:'Space Mono',monospace">총 0명</span>
      </div>
      <div class="level-bars" id="levelBars"></div>
      <canvas id="lvChart" height="90" style="margin-top:16px"></canvas>
    </div>
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">
          <div class="pt-dot"></div>실시간 제출 피드
          <span class="new-badge" id="newBadge">새 답변</span>
        </div>
        <button class="fbtn" onclick="clearBadge()">모두 읽음</button>
      </div>
      <div class="feed-scroll" id="feedWrap">
        <div class="empty"><div class="empty-icon">📡</div>Firebase 연결 중...<br>학생 답변이 실시간으로 표시됩니다</div>
      </div>
    </div>
  </div>

  <!-- 하단 차트 -->
  <div class="grid2">
    <div class="panel">
      <div class="panel-title" style="margin-bottom:14px"><div class="pt-dot"></div>레벨별 평균 지표</div>
      <canvas id="metricsChart" height="150"></canvas>
    </div>
    <div class="panel">
      <div class="panel-title" style="margin-bottom:14px"><div class="pt-dot"></div>실험별 제출 현황</div>
      <canvas id="expChart" height="150"></canvas>
    </div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, orderBy, onSnapshot, query, doc, setDoc, getDoc }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBX-BE14JViw82xAiA3Gts6p-SC6gVBjG8",
  authDomain: "student-literacy.firebaseapp.com",
  projectId: "student-literacy",
  storageBucket: "student-literacy.firebasestorage.app",
  messagingSenderId: "66926306937",
  appId: "1:66926306937:web:5204bff44a4cc5d62d16a8"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ═══════════════════════════════════════════════════════════
// ── 실험 목록 정의 ──
// 새 실험 추가 시 여기에만 항목 추가하면 됩니다
// ═══════════════════════════════════════════════════════════
const EXPS = [
  {
    id: 'sessions-acid',
    title: '산염기 적정',
    icon: '⚗️',
    color: '#00c896',
    col: 'sessions',
    mfType: 'old',  // 기존 방식 (answer, level, terms, causal, feedback)
    filterFn: (s) => !s.subject || s.subject === '산염기 적정' ||
                     (s.experimentName && !s.experimentName.includes('기체') &&
                      s.subject !== '기체 분자 운동'),
  },
  {
    id: 'element-group',
    title: '동족 원소 유사성',
    icon: '🧪',
    color: '#0066ff',
    col: 'element-group',
    mfType: 'new',
    filterFn: null,
  },
  {
    id: 'atom-periodic',
    title: '원자 & 주기율표',
    icon: '⚛️',
    color: '#f97316',
    col: 'atom-periodic',
    mfType: 'new',
    filterFn: null,
  },
  // ───────────────────────────────────────────────────────
  // 기체 분자 운동 (새로 추가 — sessions 컬렉션 공유, subject로 필터)
  // ───────────────────────────────────────────────────────
  {
    id: 'gas-kinetics',
    title: '기체 분자 운동',
    icon: '💨',
    color: '#7c3aed',
    col: 'sessions',
    mfType: 'new',
    filterFn: (s) => s.subject === '기체 분자 운동' ||
                     (s.experimentName && s.experimentName.includes('기체')),
  },
  // ── 이온의 이동 (추가) ──
  {
    id: 'ion-migration',
    title: '이온의 이동',
    icon: '⚡',
    color: '#9333ea',
    col: 'sessions',
    mfType: 'new',
    filterFn: (s) => s.subject === '이온의 이동',
  },
];

const MF_STEPS = ['1단계·현상관찰', '2단계·원인추론', '3단계·개념연결', '4단계·일반화'];

let allData = {};   // expId → 배열
let activeExps = [];
let isFirst = true;
let newCnt = 0;
let curExpTab = 'sessions-acid';
let filter = 'all';

// 시계
setInterval(() => {
  document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('ko');
}, 1000);

// ── 활성 실험 로드 ──
async function loadActiveExps() {
  try {
    const d = await getDoc(doc(db, 'settings', 'activeExperiments'));
    activeExps = d.exists() ? (d.data().active || []) : EXPS.map(e => e.id);
  } catch(e) {
    activeExps = EXPS.map(e => e.id);
  }
  renderToggles();
}

// 토글
async function toggleExp(id) {
  const idx = activeExps.indexOf(id);
  if (idx >= 0) activeExps.splice(idx, 1);
  else activeExps.push(id);
  try {
    await setDoc(doc(db, 'settings', 'activeExperiments'), { active: activeExps });
    showToast(idx >= 0 ? '⏸ 비활성화됨' : '▶ 활성화됨!');
  } catch(e) {
    showToast('저장 실패: ' + e.message);
  }
  renderToggles();
  document.getElementById('sExpCnt').textContent = activeExps.length;
}
window.toggleExp = toggleExp;

function renderToggles() {
  const row = document.getElementById('toggleRow');
  row.innerHTML = '';
  EXPS.forEach(exp => {
    const on = activeExps.includes(exp.id);
    const cnt = (allData[exp.id] || []).length;
    const div = document.createElement('div');
    div.className = 'exp-toggle-card' + (on ? ' active-card' : '');
    div.innerHTML = `
      <div class="etc-header">
        <div class="etc-icon">${exp.icon}</div>
        <div class="etc-info">
          <div class="etc-title">${exp.title}</div>
          <div class="etc-sub">${cnt}개 제출됨</div>
        </div>
        <div class="toggle-wrap">
          <span class="toggle-lbl" style="color:${on ? 'var(--primary)' : 'var(--gray-400)'}">${on ? 'ON' : 'OFF'}</span>
          <div class="toggle ${on ? 'on' : ''}" onclick="toggleExp('${exp.id}')"></div>
        </div>
      </div>
      <div class="etc-stats">
        <div class="etc-stat ${cnt > 0 ? 'hl' : ''}">📋 ${cnt}개</div>
        <div class="etc-stat">${on ? '🟢 활성' : '⏸ 대기'}</div>
      </div>`;
    row.appendChild(div);
  });
}

// ── Firebase 실시간 연결 ──
// sessions 컬렉션: 한 번만 구독하고, filterFn으로 각 실험에 분배
const sessionsExps = EXPS.filter(e => e.col === 'sessions');
const otherExps    = EXPS.filter(e => e.col !== 'sessions');

EXPS.forEach(e => { allData[e.id] = []; });

// sessions 컬렉션 — 한 번 구독
const sessionsQ = query(collection(db, 'sessions'), orderBy('createdAt', 'desc'));
onSnapshot(sessionsQ, snap => {
  document.getElementById('syncDot').className = 'sync-dot on';
  document.getElementById('syncText').textContent = '실시간 연결';

  const allSessions = [];
  snap.forEach(d => allSessions.push({ id: d.id, ...d.data() }));

  // 각 실험의 filterFn으로 분배
  sessionsExps.forEach(exp => {
    allData[exp.id] = exp.filterFn
      ? allSessions.filter(exp.filterFn)
      : allSessions;
  });

  const added = snap.docChanges().filter(c => c.type === 'added');
  if (!isFirst && added.length) {
    newCnt += added.length;
    const badge = document.getElementById('newBadge');
    badge.textContent = `+${newCnt} 새 답변`;
    badge.style.display = 'inline-block';
    const d2 = added[0].doc.data();
    const name = d2.studentName || '학생';
    const expTitle = EXPS.find(e => e.filterFn && e.filterFn(d2))?.title || '실험';
    showToast(`📩 ${name} · ${expTitle} 제출!`);
    prependFeed(added.map(c => ({ id: c.doc.id, ...c.doc.data() })));
  }
  renderAll();
}, err => {
  document.getElementById('syncDot').className = 'sync-dot';
  document.getElementById('syncText').textContent = '연결 오류';
});

// 독립 컬렉션들 (element-group, atom-periodic 등)
otherExps.forEach(exp => {
  const tsField = 'ts';
  const q = query(collection(db, exp.col), orderBy(tsField, 'desc'));
  onSnapshot(q, snap => {
    allData[exp.id] = [];
    snap.forEach(d => allData[exp.id].push({ id: d.id, ...d.data() }));
    const added = snap.docChanges().filter(c => c.type === 'added');
    if (!isFirst && added.length) {
      newCnt += added.length;
      const badge = document.getElementById('newBadge');
      badge.textContent = `+${newCnt} 새 답변`;
      badge.style.display = 'inline-block';
      const d2 = added[0].doc.data();
      const name = d2.student?.name || d2.studentName || '학생';
      showToast(`📩 ${name} · ${exp.title} 제출!`);
      prependFeed(added.map(c => ({ id: c.doc.id, ...c.doc.data(), _expId: exp.id, _exp: exp })));
    }
    renderAll();
  }, err => console.error(exp.id, err));
});

setTimeout(() => { isFirst = false; }, 2000);

function renderAll() {
  renderStats();
  renderToggles();
  renderExpTabs();
  renderLevelBars();
  renderCharts();
}

// ── 통계 ──
function renderStats() {
  const all = Object.values(allData).flat();
  const total = all.length;
  const students = new Set(all.map(s => s.student?.id || s.studentId || '').filter(Boolean)).size;
  let mfTotal = 0, mfCnt = 0;
  all.forEach(s => {
    if (s.mfAnswers) {
      const done = s.mfAnswers.filter(a => a && a !== '(건너뜀)').length;
      mfTotal += done; mfCnt++;
    } else if (s.level) { mfTotal += s.level; mfCnt++; }
  });
  const avgLv = mfCnt > 0 ? (mfTotal / mfCnt).toFixed(1) : '-';
  const basic = all.filter(s => {
    if (s.mfAnswers) return s.mfAnswers.filter(a => a && a !== '(건너뜀)').length <= 1;
    return (s.level || 1) === 1;
  }).length;
  anim('sTotal', total); anim('sStudents', students);
  document.getElementById('sAvgLv').textContent = avgLv;
  anim('sExpCnt', activeExps.length); anim('sBasic', basic);
  document.getElementById('totalBadge').textContent = `총 ${students}명`;
}

// ── 실험별 탭 ──
function renderExpTabs() {
  const tabs = document.getElementById('expTabs');
  const panels = document.getElementById('expTabPanels');
  tabs.innerHTML = '';
  panels.innerHTML = '';
  EXPS.forEach(exp => {
    const cnt = (allData[exp.id] || []).length;
    const tab = document.createElement('div');
    tab.className = 'exp-tab' + (curExpTab === exp.id ? ' active' : '');
    tab.innerHTML = `${exp.icon} ${exp.title} <span class="tab-cnt">${cnt}</span>`;
    tab.onclick = () => { curExpTab = exp.id; renderExpTabs(); };
    tabs.appendChild(tab);
    const panel = document.createElement('div');
    panel.style.display = curExpTab === exp.id ? 'block' : 'none';
    panel.innerHTML = renderExpTable(exp);
    panels.appendChild(panel);
  });
}

function renderExpTable(exp) {
  const rows = allData[exp.id] || [];
  if (!rows.length) return `<div class="empty"><div class="empty-icon">📋</div>아직 제출이 없어요</div>`;
  let filtered = rows;
  if (filter !== 'all') filtered = filtered.filter(s => {
    const done = s.mfAnswers ? s.mfAnswers.filter(a => a && a !== '(건너뜀)').length : (s.level || 1);
    return String(done) === filter || (filter === '4' && done >= 4);
  });

  return `
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
    <div class="filter-row">
      <button class="fbtn ${filter === 'all' ? 'active' : ''}" onclick="setFilter('all',event)">전체</button>
      <button class="fbtn ${filter === '1' ? 'active' : ''}" onclick="setFilter('1',event)">1단계</button>
      <button class="fbtn ${filter === '2' ? 'active' : ''}" onclick="setFilter('2',event)">2단계</button>
      <button class="fbtn ${filter === '3' ? 'active' : ''}" onclick="setFilter('3',event)">3단계</button>
      <button class="fbtn ${filter === '4' ? 'active' : ''}" onclick="setFilter('4',event)">4단계</button>
    </div>
  </div>
  <div class="tbl-wrap">
    <table>
      <thead><tr>
        <th>학번</th><th>이름</th><th>실험명</th>
        ${exp.mfType === 'new' ? '<th>문해력 단계</th><th>답변 미리보기</th>' : '<th>레벨</th><th>용어</th><th>인과</th><th>답변 미리보기</th>'}
        <th>제출시간</th><th></th>
      </tr></thead>
      <tbody>
        ${filtered.map(s => {
          const stuId   = s.student?.id   || s.studentId   || '-';
          const stuName = s.student?.name || s.studentName || '-';
          const expName = s.experimentName || exp.title;
          const ts = fmtTime(s.ts || s.createdAt);
          if (exp.mfType === 'new') {
            const mfDone = (s.mfAnswers || []).filter(a => a && a !== '(건너뜀)').length;
            const mfDots = (s.mfAnswers || []).map((a, i) =>
              `<span style="display:inline-block;width:16px;height:16px;border-radius:4px;background:${a && a !== '(건너뜀)' ? 'rgba(0,102,255,.15)' : 'var(--gray-100)'};color:${a && a !== '(건너뜀)' ? 'var(--primary)' : 'var(--gray-400)'};font-size:8px;font-weight:700;text-align:center;line-height:16px">${i+1}</span>`
            ).join(' ');
            const preview = (s.mfAnswers || []).find(a => a && a !== '(건너뜀)') || '-';
            const sJson = JSON.stringify(s).replace(/'/g, "\\'");
            const eJson = JSON.stringify(exp).replace(/'/g, "\\'");
            return `<tr style="cursor:pointer" onclick='showDetailNew(${sJson}, ${eJson})'>
              <td style="font-family:'Space Mono',monospace;font-size:11px;color:var(--gray-500)">${stuId}</td>
              <td><strong>${stuName}</strong></td>
              <td style="font-size:11px;color:var(--gray-500)">${expName}</td>
              <td>${mfDots} <span style="font-size:10px;color:var(--primary);font-weight:700;margin-left:4px">${mfDone}/4</span></td>
              <td><div class="ans-preview">${preview}</div></td>
              <td style="font-size:10px;color:var(--gray-400);font-family:'Space Mono',monospace">${ts}</td>
              <td><button class="detail-btn" onclick="event.stopPropagation();showDetailNew(${sJson},${eJson})">상세</button></td>
            </tr>`;
          } else {
            const sJson = JSON.stringify(s).replace(/'/g, "\\'");
            return `<tr style="cursor:pointer" onclick='showDetailOld(${sJson})'>
              <td style="font-family:'Space Mono',monospace;font-size:11px;color:var(--gray-500)">${stuId}</td>
              <td><strong>${stuName}</strong></td>
              <td style="font-size:11px;color:var(--gray-500)">${expName}</td>
              <td><span class="level-chip ${chipClass(s.level || 1)}">${lvName(s.level || 1)}</span></td>
              <td style="font-family:'Space Mono',monospace;color:var(--primary);font-weight:700">${s.terms || 0}</td>
              <td style="font-family:'Space Mono',monospace;color:var(--success);font-weight:700">${s.causal || 0}</td>
              <td><div class="ans-preview">${s.answer || '-'}</div></td>
              <td style="font-size:10px;color:var(--gray-400);font-family:'Space Mono',monospace">${ts}</td>
              <td><button class="detail-btn" onclick="event.stopPropagation();showDetailOld(${sJson})">상세</button></td>
            </tr>`;
          }
        }).join('')}
      </tbody>
    </table>
  </div>`;
}

// ── 모달 ──
window.showDetailNew = function(s, exp) {
  if (typeof s === 'string') s = JSON.parse(s);
  if (typeof exp === 'string') exp = JSON.parse(exp);
  const stuName = s.student?.name || s.studentName || '-';
  document.getElementById('modalTitle').textContent = `${exp.icon} ${stuName} · ${s.experimentName || exp.title}`;
  const ts = fmtTime(s.ts || s.createdAt);
  const mfDone = (s.mfAnswers || []).filter(a => a && a !== '(건너뜀)').length;
  document.getElementById('modalBody').innerHTML = `
    <div style="margin-bottom:10px;font-size:11px;color:var(--gray-400);font-family:'Space Mono',monospace">
      제출: ${ts} · 학번: ${s.student?.id || s.studentId || '-'} · 문해력 ${mfDone}/4단계
    </div>
    <div style="font-size:11px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">META FLOW+ 문해력 답변</div>
    ${(s.mfAnswers || []).map((ans, i) => `
      <div class="mf-answer-block">
        <div class="mf-step-label">${MF_STEPS[i] || '단계 ' + (i+1)}</div>
        <div class="${ans && ans !== '(건너뜀)' ? 'mf-step-text' : 'mf-step-empty'}">${ans || '(미작성)'}</div>
      </div>`).join('') || '<div style="color:var(--gray-400);font-size:12px;padding:12px">문해력 답변 없음</div>'}`;
  document.getElementById('modal').classList.add('show');
};

window.showDetailOld = function(s) {
  if (typeof s === 'string') s = JSON.parse(s);
  document.getElementById('modalTitle').textContent = `${s.studentName || '-'} · ${s.experimentName || '산염기 적정'}`;
  document.getElementById('modalBody').innerHTML = `
    <div style="margin-bottom:10px"><span class="level-chip ${chipClass(s.level || 1)}" style="font-size:11px;padding:4px 12px">${lvName(s.level || 1)}</span></div>
    <div class="modal-ans">"${s.answer || ''}"</div>
    <div class="modal-metrics">
      <div class="mm"><span class="mm-val" style="color:var(--primary)">${s.terms || 0}개</span><span class="mm-lbl">과학 용어</span></div>
      <div class="mm"><span class="mm-val" style="color:var(--success)">${s.causal || 0}개</span><span class="mm-lbl">인과관계</span></div>
      <div class="mm"><span class="mm-val" style="color:var(--warning)">${s.sentences || 0}개</span><span class="mm-lbl">문장 수</span></div>
    </div>
    <div class="modal-fb"><strong>🤖 AI 피드백</strong><br>${s.feedback || '분석 중...'}</div>
    <div style="margin-top:10px;font-size:10px;color:var(--gray-400);font-family:'Space Mono',monospace">
      제출: ${fmtTime(s.createdAt)} · 학번: ${s.studentId}
    </div>`;
  document.getElementById('modal').classList.add('show');
};

window.closeModal = () => document.getElementById('modal').classList.remove('show');
window.setFilter = (f, e) => {
  filter = f;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  renderExpTabs();
};
window.clearBadge = () => { newCnt = 0; document.getElementById('newBadge').style.display = 'none'; };

// ── 피드 ──
function renderFeed(items) {
  const w = document.getElementById('feedWrap');
  if (!items.length) { w.innerHTML = '<div class="empty"><div class="empty-icon">📡</div>아직 제출이 없어요</div>'; return; }
  w.innerHTML = items.map(s => feedHtml(s, false)).join('');
}
function prependFeed(items) {
  const w = document.getElementById('feedWrap');
  if (w.querySelector('.empty')) w.innerHTML = '';
  items.forEach(s => { const div = document.createElement('div'); div.innerHTML = feedHtml(s, true); w.insertBefore(div.firstChild, w.firstChild); });
}
function feedHtml(s, isNew) {
  const exp = EXPS.find(e => e.filterFn ? e.filterFn(s) : e.id === s._expId) || EXPS[0];
  const name = s.student?.name || s.studentName || '-';
  const expName = s.experimentName || exp.title;
  const mfDone = s.mfAnswers ? s.mfAnswers.filter(a => a && a !== '(건너뜀)').length : (s.level || 1);
  const preview = s.mfAnswers ? (s.mfAnswers.find(a => a && a !== '(건너뜀)') || '-') : (s.answer || '-');
  const chip = mfDone >= 4 ? 'chip-excellent' : mfDone >= 3 ? 'chip-advanced' : mfDone >= 2 ? 'chip-proficient' : 'chip-basic';
  const chipTxt = mfDone >= 4 ? '4단계' : mfDone >= 3 ? '3단계' : mfDone >= 2 ? '2단계' : '1단계';
  return `<div class="feed-item${isNew ? ' new' : ''}">
    <div class="feed-avatar">${['😐','🙂','😊','🌟'][Math.min(mfDone, 4)-1] || '😐'}</div>
    <div class="feed-info">
      <div class="feed-name">${name}</div>
      <div class="feed-exp">${exp.icon} ${expName}</div>
      <div class="feed-ans">"${preview}"</div>
    </div>
    <div class="feed-right">
      <span class="level-chip ${chip}">${chipTxt}</span>
      <span class="feed-time">${fmtTime(s.ts || s.createdAt)}</span>
    </div>
  </div>`;
}

setTimeout(() => {
  const allItems = Object.values(allData).flat();
  allItems.sort((a, b) => {
    const ta = a.ts?.seconds || a.createdAt?.seconds || 0;
    const tb = b.ts?.seconds || b.createdAt?.seconds || 0;
    return tb - ta;
  });
  renderFeed(allItems.slice(0, 10));
}, 1500);

// ── 레벨 분포 바 ──
function renderLevelBars() {
  const all = Object.values(allData).flat();
  const cnt = {1:0, 2:0, 3:0, 4:0};
  all.forEach(s => {
    const lv = s.mfAnswers ? Math.min(s.mfAnswers.filter(a => a && a !== '(건너뜀)').length, 4) || 1 : (s.level || 1);
    cnt[Math.max(1, Math.min(4, lv))]++;
  });
  const max = Math.max(...Object.values(cnt), 1);
  const levels = [
    {l:4, name:'4단계', color:'linear-gradient(90deg,#00c896,#00e5b0)', tc:'var(--success)'},
    {l:3, name:'3단계', color:'linear-gradient(90deg,#0066ff,#00b4d8)', tc:'var(--primary)'},
    {l:2, name:'2단계', color:'linear-gradient(90deg,#ffb300,#ffcc33)', tc:'var(--warning)'},
    {l:1, name:'1단계', color:'linear-gradient(90deg,#ff4560,#ff7a90)', tc:'var(--danger)'},
  ];
  document.getElementById('levelBars').innerHTML = levels.map(it => `
    <div class="lb-item">
      <div class="lb-label" style="color:${it.tc}">${it.name}</div>
      <div class="lb-track"><div class="lb-fill" style="width:${Math.round(cnt[it.l]/max*100)}%;background:${it.color}"><span>${cnt[it.l] > 0 ? cnt[it.l] + '명' : ''}</span></div></div>
      <div class="lb-count" style="color:${it.tc}">${cnt[it.l]}명</div>
    </div>`).join('');
  drawLvChart(cnt);
}

// ── 차트 ──
function drawLvChart(cnt) {
  const cv = document.getElementById('lvChart'); if (!cv) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width = cv.offsetWidth * dpr; cv.height = 90 * dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  const W = cv.offsetWidth, H = 90; ctx.clearRect(0, 0, W, H);
  const data = [{l:'1단계',v:cnt[1],c:'#ff4560'},{l:'2단계',v:cnt[2],c:'#ffb300'},{l:'3단계',v:cnt[3],c:'#0066ff'},{l:'4단계',v:cnt[4],c:'#00c896'}];
  const max = Math.max(...data.map(d => d.v), 1);
  const bW = (W - 40) / data.length;
  data.forEach((d, i) => {
    const x = 20 + i*bW + bW*.1, w = bW*.8, h = Math.max((d.v/max)*(H-28), 2), y = H-22-h;
    const g = ctx.createLinearGradient(0, y, 0, H-22); g.addColorStop(0, d.c); g.addColorStop(1, d.c+'33');
    ctx.fillStyle = g; ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, [4,4,0,0]); else ctx.rect(x, y, w, h);
    ctx.fill();
    if (d.v > 0) { ctx.fillStyle = d.c; ctx.font = `bold 10px 'Space Mono',monospace`; ctx.textAlign = 'center'; ctx.fillText(d.v, x+w/2, y-4); }
    ctx.fillStyle = '#8898bb'; ctx.font = `9px 'Pretendard',sans-serif`; ctx.textAlign = 'center'; ctx.fillText(d.l, x+w/2, H-6);
  });
}

function renderCharts() {
  const all = Object.values(allData).flat();
  const cv = document.getElementById('metricsChart');
  if (cv) {
    const dpr = window.devicePixelRatio||1; cv.width = cv.offsetWidth*dpr; cv.height = 150*dpr;
    const ctx = cv.getContext('2d'); ctx.scale(dpr,dpr);
    const W = cv.offsetWidth, H = 150; ctx.clearRect(0,0,W,H);
    const pL=36,pR=10,pT=20,pB=28,cW=W-pL-pR,cH=H-pT-pB;
    const ldata=[1,2,3,4].map(l=>{
      const items=all.filter(s=>{const lv=s.mfAnswers?Math.min(s.mfAnswers.filter(a=>a&&a!=='(건너뜀)').length,4)||1:(s.level||1);return lv===l;});
      return{l,mf:items.length?(items.reduce((a,s)=>a+(s.mfAnswers?s.mfAnswers.filter(x=>x&&x!=='(건너뜀)').length:(s.terms||0)),0)/items.length).toFixed(1):0};
    });
    const max=4;
    const labels=['1단계','2단계','3단계','4단계'],colors=['#ff4560','#ffb300','#0066ff','#00c896'];
    for(let i=0;i<=max;i++){const y=pT+cH-(i/max)*cH;ctx.strokeStyle='#e2e8f7';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pL,y);ctx.lineTo(W-pR,y);ctx.stroke();ctx.fillStyle='#8898bb';ctx.font=`8px 'Space Mono',monospace`;ctx.textAlign='right';ctx.fillText(i,pL-4,y+3);}
    ldata.forEach((d,i)=>{
      const bH=Math.max((parseFloat(d.mf)/max)*cH,1),bW=(cW/4)*.6,bX=pL+i*(cW/4)+(cW/4)*.2,bY=pT+cH-bH;
      ctx.fillStyle=colors[i]+'bb';ctx.beginPath();
      if(ctx.roundRect)ctx.roundRect(bX,bY,bW,bH,[2,2,0,0]);else ctx.rect(bX,bY,bW,bH);
      ctx.fill();
      if(parseFloat(d.mf)>0){ctx.fillStyle='#5a6a8a';ctx.font=`7px 'Space Mono',monospace`;ctx.textAlign='center';ctx.fillText(d.mf,bX+bW/2,bY-3);}
      ctx.fillStyle=colors[i];ctx.font=`8px 'Pretendard',sans-serif`;ctx.textAlign='center';ctx.fillText(labels[i],bX+bW/2,H-8);
    });
  }
  const cv2 = document.getElementById('expChart');
  if (cv2) {
    const dpr=window.devicePixelRatio||1;cv2.width=cv2.offsetWidth*dpr;cv2.height=150*dpr;
    const ctx=cv2.getContext('2d');ctx.scale(dpr,dpr);
    const W=cv2.offsetWidth,H=150;ctx.clearRect(0,0,W,H);
    const exps=EXPS.map(e=>({name:e.title,cnt:(allData[e.id]||[]).length,color:e.color,icon:e.icon}));
    const max=Math.max(...exps.map(e=>e.cnt),1);
    const pB=10,pT=10,bH=(H-pT-pB-exps.length*4)/exps.length;
    exps.forEach(({name,cnt,color,icon},i)=>{
      const y=pT+i*(bH+4),bW=Math.max((cnt/max)*(W-110),4);
      const g=ctx.createLinearGradient(10,0,10+bW,0);g.addColorStop(0,color);g.addColorStop(1,color+'44');
      ctx.fillStyle=g;ctx.beginPath();
      if(ctx.roundRect)ctx.roundRect(10,y,bW,bH,[3]);else ctx.rect(10,y,bW,bH);
      ctx.fill();
      ctx.fillStyle='#5a6a8a';ctx.font=`9px 'Pretendard',sans-serif`;ctx.textAlign='left';ctx.fillText(icon+' '+name.substring(0,8),10+bW+6,y+bH/2+3);
      ctx.fillStyle=color;ctx.font=`bold 9px 'Space Mono',monospace`;ctx.textAlign='right';ctx.fillText(cnt+'회',W-8,y+bH/2+3);
    });
  }
}

// ── 유틸 ──
function lvName(l){return{1:'Basic',2:'Proficient',3:'Advanced',4:'Excellent'}[l]||'Basic';}
function chipClass(l){return{1:'chip-basic',2:'chip-proficient',3:'chip-advanced',4:'chip-excellent'}[l]||'chip-basic';}
function fmtTime(ts){if(!ts)return'-';try{const d=ts.toDate?ts.toDate():new Date(ts);return(d.getMonth()+1)+'/'+(d.getDate())+' '+d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}catch{return'-';}}
function anim(id,target){const el=document.getElementById(id);if(!el)return;let c=parseInt(el.textContent)||0;if(c===target)return;const step=(target-c)/20;const t=setInterval(()=>{c=Math.min(c+step,target);el.textContent=Math.round(c);if(Math.round(c)>=target){el.textContent=target;clearInterval(t);}},30);}
function showToast(msg){const t=document.getElementById('toast');t.innerHTML=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
window.addEventListener('resize',()=>{renderCharts();renderLevelBars();});

// ── 테마 ──
const PRESETS={blue:{primary:'#0066ff'},purple:{primary:'#7c3aed'},green:{primary:'#059669'},red:{primary:'#dc2626'},teal:{primary:'#0891b2'},dark:{primary:'#60a5fa'}};
window.toggleTheme=function(){document.getElementById('themePanel').classList.toggle('show');};
window.applyPreset=function(key,btn){const p=PRESETS[key];document.getElementById('colorPicker').value=p.primary;document.getElementById('colorHex').value=p.primary;document.querySelectorAll('.theme-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');};
document.getElementById('colorPicker').addEventListener('input',function(){document.getElementById('colorHex').value=this.value;});
window.applyTheme=function(){
  const color=document.getElementById('colorHex').value||'#0066ff';
  const school=document.getElementById('schoolName').value;
  const root=document.documentElement;
  root.style.setProperty('--primary',color);
  const r=parseInt(color.slice(1,3),16),g2=parseInt(color.slice(3,5),16),b=parseInt(color.slice(5,7),16);
  root.style.setProperty('--primary-light',`rgba(${r},${g2},${b},0.08)`);
  root.style.setProperty('--primary-mid',`rgba(${r},${g2},${b},0.2)`);
  if(school){document.getElementById('schoolChip').textContent='📍 '+school;localStorage.setItem('mf_schoolName',school);}
  localStorage.setItem('mf_themeColor',color);
  showToast('✅ 테마가 적용됐어요!');document.getElementById('themePanel').classList.remove('show');
};
window.resetTheme=function(){['mf_themeColor','mf_schoolName'].forEach(k=>localStorage.removeItem(k));location.reload();};
window.addEventListener('load',()=>{
  const color=localStorage.getItem('mf_themeColor');
  const school=localStorage.getItem('mf_schoolName');
  if(color){document.getElementById('colorPicker').value=color;document.getElementById('colorHex').value=color;const root=document.documentElement;root.style.setProperty('--primary',color);const r=parseInt(color.slice(1,3),16),g2=parseInt(color.slice(3,5),16),b=parseInt(color.slice(5,7),16);root.style.setProperty('--primary-light',`rgba(${r},${g2},${b},0.08)`);root.style.setProperty('--primary-mid',`rgba(${r},${g2},${b},0.2)`);}
  if(school){document.getElementById('schoolName').value=school;document.getElementById('schoolChip').textContent='📍 '+school;}
});

loadActiveExps();
