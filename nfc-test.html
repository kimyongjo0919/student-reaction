<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFC 테스트</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #0a0e1a;
  color: white;
  font-family: 'Noto Sans KR', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  gap: 20px;
}

h1 {
  font-size: 22px;
  color: #00d2ff;
  text-align: center;
}

.btn {
  width: 100%;
  max-width: 340px;
  padding: 20px;
  font-size: 18px;
  font-weight: 700;
  border-radius: 16px;
  border: 2px solid #00d2ff;
  background: rgba(0,210,255,0.1);
  color: #00d2ff;
  cursor: pointer;
  transition: all 0.2s;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.status {
  width: 100%;
  max-width: 340px;
  padding: 16px;
  border-radius: 12px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  font-size: 14px;
  text-align: center;
  color: #aaa;
  line-height: 1.8;
}

.result {
  width: 100%;
  max-width: 340px;
  padding: 20px;
  border-radius: 16px;
  background: rgba(46,213,115,0.1);
  border: 2px solid #2ed573;
  font-size: 22px;
  font-weight: 700;
  text-align: center;
  color: #2ed573;
  display: none;
  word-break: break-all;
}

.log {
  width: 100%;
  max-width: 340px;
  padding: 12px;
  border-radius: 10px;
  background: rgba(0,0,0,0.3);
  font-size: 12px;
  color: #aaa;
  font-family: monospace;
  max-height: 200px;
  overflow-y: auto;
  line-height: 1.8;
}

.dot {
  width: 16px; height: 16px;
  border-radius: 50%;
  background: #444;
  display: inline-block;
  margin-right: 8px;
  vertical-align: middle;
}
.dot.green { background: #2ed573; animation: pulse 1s infinite; }
.dot.yellow { background: #ffd32a; animation: pulse 0.5s infinite; }
.dot.red { background: #ff4757; }

@keyframes pulse {
  0%,100% { opacity:1; }
  50% { opacity:0.3; }
}
</style>
</head>
<body>

<h1>📲 NFC 태그 테스트</h1>

<button class="btn" id="startBtn" onclick="startNFC()">
  📲 NFC 스캔 시작
</button>

<div class="status" id="status">
  <span class="dot" id="dot"></span>
  버튼을 눌러서 NFC 스캔을 시작하세요
</div>

<div class="result" id="result">
  여기에 태그 내용 표시
</div>

<div class="log" id="log">
  📋 로그...<br>
</div>

<script>
function log(msg) {
  const el = document.getElementById('log');
  el.innerHTML += msg + '<br>';
  el.scrollTop = el.scrollHeight;
}

function setStatus(msg, color) {
  const dot = document.getElementById('dot');
  const status = document.getElementById('status');
  dot.className = 'dot ' + (color||'');
  status.innerHTML = '<span class="dot ' + (color||'') + '"></span>' + msg;
}

async function startNFC() {
  const btn = document.getElementById('startBtn');
  const result = document.getElementById('result');

  log('▶ NFC 시작 버튼 클릭');

  // 지원 여부 확인
  if(!('NDEFReader' in window)) {
    setStatus('❌ 이 브라우저는 NFC 미지원<br>안드로이드 크롬에서만 작동해요', 'red');
    log('❌ NDEFReader 없음 - 미지원 브라우저');
    return;
  }

  log('✅ NDEFReader 지원 확인');
  setStatus('⏳ NFC 권한 요청 중...', 'yellow');
  btn.disabled = true;
  btn.textContent = '⏳ 권한 요청 중...';

  try {
    const ndef = new NDEFReader();
    log('✅ NDEFReader 생성 완료');

    await ndef.scan();
    log('✅ ndef.scan() 성공! 카드 갖다 대세요');

    setStatus('✅ NFC 스캔 중!<br>카드를 폰 뒤에 갖다 대세요 📱', 'green');
    btn.textContent = '✅ 스캔 중... (카드 갖다 대세요)';
    btn.style.borderColor = '#2ed573';
    btn.style.color = '#2ed573';

    ndef.onreading = (event) => {
      log('📲 태그 읽힘!');

      for(const record of event.message.records) {
        log('  recordType: ' + record.recordType);

        let text = '';
        try {
          if(record.recordType === 'text') {
            const decoder = new TextDecoder(record.encoding || 'utf-8');
            text = decoder.decode(record.data).trim();
          } else if(record.recordType === 'url') {
            const decoder = new TextDecoder();
            text = decoder.decode(record.data).trim();
          } else {
            text = '[타입: ' + record.recordType + ']';
          }
        } catch(e) {
          text = '[읽기 오류: ' + e.message + ']';
        }

        log('  내용: ' + text);

        // 결과 크게 표시
        result.style.display = 'block';
        result.textContent = '📲 ' + text;
        setStatus('✅ 태그 인식 성공!', 'green');
      }
    };

    ndef.onreadingerror = (e) => {
      log('❌ 읽기 오류: ' + e.message);
      setStatus('❌ 태그 읽기 오류<br>다시 갖다 대보세요', 'red');
    };

  } catch(e) {
    log('❌ 오류 발생: ' + e.name + ' - ' + e.message);
    btn.disabled = false;
    btn.textContent = '📲 NFC 스캔 다시 시작';

    if(e.name === 'NotAllowedError') {
      setStatus('❌ NFC 권한 거부됨<br>브라우저 설정에서 허용해주세요', 'red');
    } else if(e.name === 'NotSupportedError') {
      setStatus('❌ NFC 미지원 기기예요', 'red');
    } else {
      setStatus('❌ 오류: ' + e.message, 'red');
    }
  }
}

// 페이지 로드 시 환경 확인
window.onload = () => {
  log('브라우저: ' + navigator.userAgent.substring(0,60));
  log('HTTPS: ' + (location.protocol === 'https:' ? '✅' : '❌ ' + location.protocol));
  log('NDEFReader: ' + ('NDEFReader' in window ? '✅ 지원' : '❌ 미지원'));
};
</script>
</body>
</html>
