<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>META FLOW+ | 실험기구 사용법 게임 모음</title>
<style>
  :root{
    --navy-950:#0a0618; --navy-900:#150c2e; --navy-800:#1e1240; --navy-700:#2f1c5c;
    --mint-400:#22e6c4; --mint-300:#7ef5df; --amber-400:#ffcb3d; --red-400:#ff4d6d;
    --magenta-400:#ff3fc0;
    --ink-100:#f5f0ff; --ink-300:#c9b8ea; --ink-500:#9a86c4;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; min-height:100vh; height:100%;
    background:
      radial-gradient(circle at 12% -8%, rgba(34,230,196,0.18), transparent 45%),
      radial-gradient(circle at 100% 4%, rgba(255,63,192,0.22), transparent 42%),
      radial-gradient(circle at 45% 105%, rgba(255,203,61,0.12), transparent 50%),
      linear-gradient(160deg, #150a30, #0a0618 55%);
    color:var(--ink-100); font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  }
  .wrap{display:flex; flex-direction:column; height:100vh;}
  header{ padding:18px 22px 12px; text-align:center; flex-shrink:0; }
  header .brand{
    font-size:12px; letter-spacing:0.16em; color:var(--mint-300); font-weight:700;
    text-transform:uppercase; margin-bottom:4px;
  }
  header h1{ margin:0; font-size:22px; font-weight:800; color:var(--ink-100); }
  header p{ margin:6px 0 0; font-size:13px; color:var(--ink-500); }
  .tabbar{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; padding:14px 16px; flex-shrink:0; }
  .tabbtn{
    display:flex; align-items:center; gap:8px;
    padding:11px 18px; border-radius:12px; border:1px solid var(--navy-700);
    background:var(--navy-900); color:var(--ink-300);
    font-size:14px; font-weight:700; cursor:pointer;
    transition:all .18s ease;
  }
  .tabbtn .emoji{font-size:16px;}
  .tabbtn:hover{ border-color:var(--mint-400); color:var(--ink-100); }
  .tabbtn.active{
    background:linear-gradient(135deg, var(--mint-400), #17b39b);
    color:var(--navy-950); border-color:var(--mint-400);
    box-shadow:0 4px 18px rgba(34,230,196,0.35);
  }
  .frame-area{ flex:1; position:relative; padding:0 12px 12px; min-height:0; }
  .frame-holder{
    position:absolute; inset:0 12px 12px; border-radius:16px; overflow:hidden;
    border:1px solid var(--navy-700); background:var(--navy-950);
    display:none;
  }
  .frame-holder.active{ display:block; }
  .frame-holder iframe{ width:100%; height:100%; border:0; display:block; background:var(--navy-950); }
  .placeholder{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:10px; color:var(--ink-500); font-size:13px;
  }
  .placeholder .spinner{
    width:26px; height:26px; border-radius:50%;
    border:3px solid var(--navy-700); border-top-color:var(--mint-400);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  footer{ text-align:center; padding:8px 10px 14px; font-size:11px; color:var(--ink-500); flex-shrink:0; }
  @media (max-width:520px){
    header h1{font-size:18px;}
    .tabbtn{padding:9px 12px; font-size:12.5px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">META FLOW+</div>
    <h1>실험기구 사용법 인식 게임 모음</h1>
    <p>탭을 눌러 게임을 전환하세요 · 카메라는 탭을 벗어나면 자동으로 꺼집니다</p>
  </header>

  <div class="tabbar" id="tabbar">
    <button class="tabbtn active" data-tab="buret"><span class="emoji">🧪</span>뷰렛 파지 자세</button>
    <button class="tabbtn" data-tab="dropper"><span class="emoji">💧</span>스포이트 손모양</button>
    <button class="tabbtn" data-tab="pipette"><span class="emoji">🔵</span>피펫필러(벌브형)</button>
  </div>

  <div class="frame-area">
    <div class="frame-holder active" data-tab="buret">
      <div class="placeholder"><div class="spinner"></div>불러오는 중…</div>
    </div>
    <div class="frame-holder" data-tab="dropper">
      <div class="placeholder"><div class="spinner"></div>불러오는 중…</div>
    </div>
    <div class="frame-holder" data-tab="pipette">
      <div class="placeholder"><div class="spinner"></div>불러오는 중…</div>
    </div>
  </div>

  <footer>© META FLOW+ · 김용조 · 하나의 HTML 파일로 통합됨</footer>
</div>

<script>
  function b64ToUtf8(b64){
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  const DOCS = {
    buret: () => b64ToUtf8(document.getElementById('src-buret').textContent),
    dropper: () => b64ToUtf8(document.getElementById('src-dropper').textContent),
    pipette: () => b64ToUtf8(document.getElementById('src-pipette').textContent)
  };

  const holders = {};
  document.querySelectorAll('.frame-holder').forEach(h => holders[h.dataset.tab] = h);

  function loadTab(tab){
    const holder = holders[tab];
    if(!holder) return;
    const existing = holder.querySelector('iframe');
    if(existing) existing.remove();
    let ph = holder.querySelector('.placeholder');
    if(!ph){
      ph = document.createElement('div');
      ph.className = 'placeholder';
      ph.innerHTML = '<div class="spinner"></div>불러오는 중…';
      holder.appendChild(ph);
    } else {
      ph.style.display = 'flex';
    }
    const iframe = document.createElement('iframe');
    iframe.allow = 'camera; microphone; autoplay';
    iframe.addEventListener('load', () => { ph.style.display = 'none'; });
    holder.appendChild(iframe);
    // srcdoc keeps everything self-contained inside this single HTML file
    iframe.srcdoc = DOCS[tab]();
  }

  function unloadTab(tab){
    const holder = holders[tab];
    if(!holder) return;
    const existing = holder.querySelector('iframe');
    if(existing) existing.remove(); // stops that game's camera stream
  }

  function activate(tab){
    document.querySelectorAll('.tabbtn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    Object.keys(holders).forEach(t => {
      const isActive = t === tab;
      holders[t].classList.toggle('active', isActive);
      if(isActive){ loadTab(t); } else { unloadTab(t); }
    });
  }

  document.getElementById('tabbar').addEventListener('click', (e) => {
    const btn = e.target.closest('.tabbtn');
    if(!btn) return;
    activate(btn.dataset.tab);
  });

  activate('buret');
</script>
</body>
